<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080B1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ECOM DIGITAL">
<title>ECOM DIGITAL — Quản lý kinh doanh thương mại điện tử</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/lucide@0.395.0/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-0:#050816; --bg-1:#080B1F; --bg-2:#10142B; --bg-3:#161B36;
  --card:rgba(255,255,255,0.035); --card-hover:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.09); --border-soft:rgba(255,255,255,0.05);
  --text:#E8E9F1; --muted:#8E93AC; --muted-2:#5D6285;
  --purple:#8B5CF6; --pink:#EC4899; --blue:#3B82F6;
  --green:#22C55E; --red:#F43F5E; --yellow:#F59E0B; --cyan:#22D3EE;
  --grad-1:linear-gradient(135deg,#8B5CF6,#EC4899);
  --grad-2:linear-gradient(135deg,#3B82F6,#8B5CF6);
  --grad-3:linear-gradient(135deg,#EC4899,#3B82F6);
  --radius:14px; --radius-sm:10px;
  --shadow:0 8px 30px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(139,92,246,0.16), transparent 60%),
    radial-gradient(1000px 600px at -10% 20%, rgba(236,72,153,0.10), transparent 55%),
    radial-gradient(900px 500px at 50% 110%, rgba(59,130,246,0.10), transparent 55%),
    var(--bg-0);
  color:var(--text);
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== LAYOUT ===== */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:258px;flex-shrink:0;background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  border-right:1px solid var(--border-soft);position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;transition:width .2s ease;z-index:50;
}
.sidebar.collapsed{width:76px;}
.sb-logo{padding:22px 20px 16px;display:flex;align-items:center;gap:10px;}
.sb-logo-mark{width:38px;height:38px;border-radius:11px;background:var(--grad-1);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;box-shadow:0 0 22px rgba(139,92,246,0.45);}
.sb-logo-text{line-height:1.1;overflow:hidden;white-space:nowrap;}
.sb-logo-text b{font-size:15px;letter-spacing:0.5px;background:var(--grad-1);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;}
.sb-logo-text span{font-size:9.5px;color:var(--muted-2);letter-spacing:1.4px;}
.sidebar.collapsed .sb-logo-text{display:none;}
.sb-nav{flex:1;padding:6px 12px 20px;overflow-y:auto;}
.sb-group-title{font-size:10.5px;color:var(--muted-2);letter-spacing:1px;margin:16px 10px 6px;font-weight:600;}
.sidebar.collapsed .sb-group-title{display:none;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);font-size:13.5px;margin-bottom:2px;border:1px solid transparent;white-space:nowrap;overflow:hidden;}
.sb-item svg{flex-shrink:0;width:17px;height:17px;}
.sb-item:hover{background:var(--card-hover);color:var(--text);}
.sb-item.active{background:linear-gradient(135deg,rgba(139,92,246,0.22),rgba(236,72,153,0.14));color:#fff;border-color:rgba(139,92,246,0.35);box-shadow:0 0 18px rgba(139,92,246,0.18) inset;}
.sidebar.collapsed .sb-item span.label{display:none;}
.sb-collapse-btn{margin:10px;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--border-soft);color:var(--muted);display:flex;align-items:center;justify-content:center;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(8,11,31,0.75);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);padding:12px 22px;display:flex;align-items:center;gap:16px;
}
.hamburger{display:none;background:var(--card);border:1px solid var(--border-soft);border-radius:10px;padding:8px;color:var(--text);}
.breadcrumb{font-size:12.5px;color:var(--muted);flex-shrink:0;}
.breadcrumb b{color:var(--text);font-weight:600;}
.search-box{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border-soft);border-radius:10px;padding:8px 12px;}
.search-box input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
.search-box svg{color:var(--muted-2);width:16px;height:16px;flex-shrink:0;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.icon-btn{position:relative;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;color:var(--muted);}
.icon-btn:hover{color:var(--text);background:var(--card-hover);}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 6px var(--pink);}
.avatar{width:34px;height:34px;border-radius:10px;background:var(--grad-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

.content{padding:22px;max-width:1500px;width:100%;margin:0 auto;}
.page-title{font-size:20px;font-weight:700;margin:0 0 4px;}
.page-sub{color:var(--muted);font-size:12.5px;margin:0 0 18px;}

/* ===== CARD / GRID ===== */
.card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.grid{display:grid;gap:14px;}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:1100px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.kpi-card{padding:16px;position:relative;overflow:hidden;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kpi-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kpi-icon svg{width:17px;height:17px;color:#fff;}
.kpi-title{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0.3px;}
.kpi-value{font-size:20px;font-weight:800;margin:2px 0 6px;}
.kpi-trend{font-size:11.5px;display:flex;align-items:center;gap:4px;}
.trend-up{color:var(--green);} .trend-down{color:var(--red);} .trend-flat{color:var(--muted);}

.section-title{font-size:14.5px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--muted);background:rgba(255,255,255,0.02);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--grad-1);color:#fff;border-color:transparent;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.select, .input, .dateinput{background:var(--bg-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 10px;font-size:12.5px;outline:none;}
.select:focus,.input:focus{border-color:var(--purple);}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12.5px;font-weight:600;}
.btn:hover{background:var(--card-hover);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--grad-1);border:none;color:#fff;box-shadow:0 4px 18px rgba(139,92,246,0.35);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-danger{background:rgba(244,63,94,0.12);border:1px solid rgba(244,63,94,0.35);color:#fca5b5;}
.btn-sm{padding:5px 9px;font-size:11.5px;}
.btn-icon{padding:7px;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border-soft);}
thead th{position:sticky;top:0;background:var(--bg-2);color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--border);font-size:11.5px;}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
tbody tr:hover{background:rgba(255,255,255,0.02);}
.badge{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;display:inline-block;white-space:nowrap;}
.b-pending{background:rgba(245,158,11,0.15);color:var(--yellow);}
.b-confirmed{background:rgba(59,130,246,0.15);color:var(--blue);}
.b-shipping{background:rgba(34,211,238,0.15);color:var(--cyan);}
.b-success{background:rgba(34,197,94,0.15);color:var(--green);}
.b-return{background:rgba(244,63,94,0.15);color:var(--red);}
.b-cancelled{background:rgba(148,163,184,0.15);color:#94a3b8;}
.b-green{background:rgba(34,197,94,0.15);color:var(--green);}
.b-yellow{background:rgba(245,158,11,0.15);color:var(--yellow);}
.b-red{background:rgba(244,63,94,0.15);color:var(--red);}
.b-purple{background:rgba(139,92,246,0.18);color:#c4b5fd;}
.row-actions{display:flex;gap:6px;}
.row-actions button{background:var(--card);border:1px solid var(--border-soft);color:var(--muted);border-radius:7px;padding:5px;}
.row-actions button:hover{color:var(--text);background:var(--card-hover);}
.row-actions svg{width:14px;height:14px;display:block;}
.pagination{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--muted);}
.pagination button{background:var(--card);border:1px solid var(--border-soft);color:var(--text);border-radius:7px;padding:5px 10px;}
.pagination button:disabled{opacity:.35;}
.treasury-pagination{justify-content:space-between;flex-wrap:wrap;gap:10px;padding:0 2px}.treasury-pagination label{display:flex;align-items:center;gap:7px}.treasury-pagination select{width:auto;min-width:76px}.treasury-page-buttons{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.treasury-page-buttons button.active{border-color:var(--purple);color:var(--cyan)}

.marketing-card{min-height:255px}.marketing-code{padding:10px 12px;border:1px solid var(--border-soft);border-radius:8px;background:var(--bg);font-size:12px;overflow-wrap:anywhere;user-select:all}.marketing-toggle{display:flex;align-items:flex-start;gap:10px;font-weight:700;margin:12px 0}.marketing-toggle input{width:18px;height:18px;accent-color:var(--purple)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state svg{width:38px;height:38px;color:var(--muted-2);margin-bottom:10px;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(2,4,14,0.65);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:inherit;z-index:2;}
.modal-header h3{margin:0;font-size:15px;}
.modal-body{padding:18px 20px;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:inherit;}
.close-x{background:transparent;border:none;color:var(--muted);}
.form-row{margin-bottom:13px;}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
.form-row .input,.form-row .select,.form-row textarea{width:100%;}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
textarea.input{resize:vertical;min-height:60px;}

/* toast */
#toast-wrap{position:fixed;top:16px;right:16px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{padding:11px 16px;border-radius:11px;font-size:12.5px;font-weight:600;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:220px;animation:slidein .25s ease;border:1px solid rgba(255,255,255,0.12);}
@keyframes slidein{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.toast.success{background:linear-gradient(135deg,#16a34a,#22c55e);}
.toast.error{background:linear-gradient(135deg,#dc2626,#f43f5e);}
.toast.warning{background:linear-gradient(135deg,#b45309,#f59e0b);}

.progress-outer{height:8px;border-radius:6px;background:rgba(255,255,255,0.06);overflow:hidden;}
.progress-inner{height:100%;border-radius:6px;background:var(--grad-1);}

.insight-box{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,rgba(139,92,246,0.08),rgba(236,72,153,0.05));display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.insight-box svg{width:16px;height:16px;color:#c4b5fd;flex-shrink:0;margin-top:2px;}
.insight-box p{margin:0;font-size:12.5px;color:#e5e7f5;line-height:1.5;}

.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{background:var(--card);border:1px solid var(--border-soft);border-radius:12px;min-width:230px;flex:0 0 230px;padding:10px;max-height:70vh;overflow-y:auto;}
.kanban-col h4{font-size:12px;margin:2px 4px 10px;color:var(--muted);display:flex;justify-content:space-between;}
.kanban-card{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:12px;}
.kanban-card:hover{border-color:var(--purple);}
.kanban-card b{display:block;font-size:12.5px;margin-bottom:3px;}
.kanban-card .kc-meta{color:var(--muted);font-size:11px;margin-top:4px;}
.kanban-col.dragover{outline:1.5px dashed var(--purple);}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{padding:8px 14px;border-radius:10px;border:1px solid var(--border-soft);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:600;}
.tab-btn.active{background:var(--grad-2);color:#fff;border-color:transparent;}

.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}
.two-col{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
@media(max-width:1100px){.two-col{grid-template-columns:1fr;}}
.mini-bar{height:6px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden;margin-top:4px;}
.mini-bar-fill{height:100%;border-radius:4px;}
hr.sep{border:none;border-top:1px solid var(--border-soft);margin:14px 0;}
.muted{color:var(--muted);}
.mono{font-variant-numeric:tabular-nums;}
.stat-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.stat-line:last-child{border-bottom:none;}
.treasury-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px;}
.treasury-box{background:var(--card);border:1px solid var(--border-soft);border-radius:13px;padding:14px;min-width:0;}
.treasury-box.warning{border-color:rgba(244,63,94,.45);background:rgba(244,63,94,.07);}
.treasury-box.safe{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.06);}
.treasury-label{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px;}
.treasury-value{font-size:21px;font-weight:800;overflow-wrap:anywhere;}
.treasury-note{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45;}
.coverage-track{height:7px;background:rgba(255,255,255,.07);border-radius:8px;overflow:hidden;margin-top:9px;}
.coverage-track span{height:100%;display:block;border-radius:inherit;background:var(--grad-1);}
.notif-item{padding:10px;border-radius:10px;border:1px solid var(--border-soft);margin-bottom:8px;font-size:12px;display:flex;gap:8px;}
.notif-item svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}
.hidden{display:none!important;}
.overlay-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;display:none;}
.overlay-bg.show{display:block;}

@media(max-width:900px){
  .sidebar{position:fixed;left:-270px;top:0;height:100vh;z-index:100;transition:left .2s ease;width:258px!important;}
  .sidebar.mobile-open{left:0;}
  .hamburger{display:flex;}
  .search-box{display:none;}
  .grid-kpi{grid-template-columns:repeat(2,1fr);}
  .content{padding:14px;}
  .form-grid2{grid-template-columns:1fr;}
  .treasury-summary{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:560px){.treasury-summary{grid-template-columns:1fr;}}
/* Shared funds and organization */
[hidden]{display:none!important}
.fund-tile{border:1px solid var(--border);background:var(--bg-2);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.fund-tile strong{font-size:23px}
.org-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.org-summary>div{flex:1;min-width:130px;border:1px solid var(--border);border-radius:12px;padding:18px;background:var(--card)}.org-summary strong{display:block;font-size:28px;color:var(--cyan)}.org-summary span{color:var(--muted)}
.org-map{padding:24px 12px;background:var(--card);border:1px solid var(--border);border-radius:16px}.org-node{position:relative;padding:18px;background:var(--bg-2);border:1px solid #4f4475;border-radius:14px;min-width:0;overflow-wrap:anywhere}.org-node h3{font-size:16px;margin:12px 0 8px}.org-node p{color:var(--muted);font-size:12px;line-height:1.6;min-height:38px}.org-node .btn{margin-top:12px}.org-owner{font-weight:600;color:var(--cyan)}.org-root{max-width:400px;margin:0 auto 42px;text-align:center;background:linear-gradient(140deg,#28204b,#17223d);border-color:var(--purple)}.org-root:after{content:'';position:absolute;height:42px;width:2px;background:var(--purple);top:100%;left:50%}.org-branches{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;border-top:2px solid var(--purple);padding-top:24px}.org-branches>.org-node:before{content:'';position:absolute;width:2px;height:24px;bottom:100%;left:50%;background:var(--purple)}
.org-copy{margin-top:14px}.org-copy>b{font-size:12px;color:var(--cyan)}.org-copy p{white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0 0;line-height:1.65;color:var(--text)}.org-detail{min-width:0}.org-detail .section-title{flex-wrap:wrap;gap:10px}.handoff-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.handoff-parties{display:flex;align-items:center;gap:16px;background:var(--bg-2);border-radius:10px;padding:14px}.handoff-parties>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}.handoff-parties small{color:var(--muted);font-size:10px}.handoff-parties span{color:var(--cyan)}.handoff-arrow{font-size:24px}.workflow-strip{display:flex;overflow-x:auto;gap:24px;padding:12px 0 22px}.workflow-strip>div{flex:0 0 225px;position:relative;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--bg-2)}.workflow-strip>div:not(:last-child):after{content:'→';position:absolute;right:-20px;top:35%;color:var(--purple)}.workflow-strip span{display:block;color:var(--muted);font-size:11px;line-height:1.5;margin-top:8px}

/* ---------------- UTILITIES ---------------- */
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function formatCurrency(v){
  if(v===null||v===undefined||isNaN(v)) v=0;
  v = Math.round(v);
  return v.toLocaleString('vi-VN')+' ₫';
}
function formatNumber(v){ if(v===null||v===undefined||isNaN(v)) v=0; return Math.round(v).toLocaleString('vi-VN'); }
function formatPct(v){ if(v===null||v===undefined||isNaN(v)||!isFinite(v)) v=0; return v.toFixed(1)+'%'; }
function safeDiv(a,b){ if(!b) return 0; const r=a/b; return isFinite(r)?r:0; }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('vi-VN'); }
function localDateISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function todayISO(){ return localDateISO(new Date()); }
function addDays(dateStr,n){ const d=new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn,ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);} }

function toast(msg,type='success'){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className='toast '+type;
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },2600);
}
function confirmAction(msg,onYes){
  openModal({
    title:'Xác nhận',

    footerHtml:`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn btn-danger" id="confirmYesBtn">Xác nhận</button>`,

function ensureFinanceState(){
  ensureOrganizationState();
  if(!Array.isArray(state.cashAccounts)) state.cashAccounts=[];
  if(!Array.isArray(state.payables)) state.payables=[];
  if(!Array.isArray(state.loans)) state.loans=[];
  if(!Array.isArray(state.businessPlans)) state.businessPlans=[];
  state.businessPlans.forEach(p=>{if(!Array.isArray(p.productPlans))p.productPlans=[];if(!Array.isArray(p.tasks))p.tasks=[];});
}
function resetData(){
  state = defaultState();
  generateDemoData();
  saveData();
}
function clearAllData(){
  state = defaultState();

}
function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'ecom-digital-backup-'+todayISO()+'.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Đã tải file backup thành công','success');
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!isAdmin()){throw new Error('Chỉ quản trị viên được nhập bản sao lưu');}
      if(!data.orders || !data.products){ throw new Error('File không đúng định dạng'); }
      state = Object.assign(defaultState(), data);
      ensureFinanceState();
      saveData();
      toast('Đã nhận bản sao lưu; vui lòng chờ trạng thái Đã lưu lên Supabase trước khi tải lại trang','warning');
      navigate(currentRoute);
    }catch(err){ toast('Lỗi restore: '+err.message,'error'); }
  };
  reader.readAsText(file);
}

/* ================= SUPABASE SYNC =================
   ECOM DIGITAL lưu toàn bộ `state` dưới dạng 1 bản ghi JSONB duy nhất
   trong bảng `ecom_digital_data`, khóa chính là "Mã cửa hàng" (storeId).
   Nhờ vậy không cần đổi cấu trúc dữ liệu hiện có, chỉ cần đồng bộ
   Dữ liệu kinh doanh được truy cập qua các hàm Supabase có kiểm tra quyền.
==================================================== */
const SUPABASE_CFG_KEY = 'ecomDigitalSupabaseConfig';
const SUPABASE_TABLE = 'ecom_digital_data';
let supabaseClient = null;
let supabaseStatus = 'disconnected'; // disconnected | connecting | connected | error
let supabaseStatusMsg = '';
let supabasePushTimer = null;
let supabaseSyncing = false;

const DEFAULT_SUPABASE_CONFIG = {
  url: 'https://pyqatxrtqmrepyagzpug.supabase.co',
  anonKey: 'sb_publishable_mw9FAd_US_PPW7Z9oBerFQ_HYl5ybx6',
  storeId: 'default',
  autoSync: true
};

function getSupabaseConfig(){
  try{
    const raw = localStorage.getItem(SUPABASE_CFG_KEY);
    return raw ? {...DEFAULT_SUPABASE_CONFIG, ...JSON.parse(raw)} : {...DEFAULT_SUPABASE_CONFIG};
  }catch(e){
    return {...DEFAULT_SUPABASE_CONFIG};
  }
}
function setSupabaseConfig(cfg){
  localStorage.setItem(SUPABASE_CFG_KEY, JSON.stringify(cfg));
}
function initSupabaseClient(){
  const cfg = getSupabaseConfig();
  if(!cfg || !cfg.url || !cfg.anonKey){ supabaseClient=null; supabaseStatus='disconnected'; return null; }
  try{
    supabaseClient = supabase.createClient(cfg.url, cfg.anonKey);
    return supabaseClient;
  }catch(e){
    supabaseClient = null; supabaseStatus='error'; supabaseStatusMsg = e.message;
    return null;
  }
}
function ensureSupabaseClient(){
  if(supabaseClient) return supabaseClient;
  return initSupabaseClient();
}
async function saveSupabaseSettingsForm(){
  const url = document.getElementById('sbUrl').value.trim();
  const anonKey = document.getElementById('sbKey').value.trim();
  const storeId = document.getElementById('sbStoreId').value.trim() || 'default';
  const autoSync = document.getElementById('sbAutoSync').checked;
  if(!url || !anonKey){ toast('Vui lòng nhập đầy đủ Project URL và Anon Key','error'); return; }
  if(hasPendingChanges()){toast('Có thay đổi chưa lưu; hãy tải bản nháp JSON trước khi đổi kết nối','warning');return;}
  await ensureSupabaseClient()?.auth.signOut();
  setSupabaseConfig({url, anonKey, storeId, autoSync});
  accessProfile=null;accessUser=null;state=null;serverSnapshot=null;
  initSupabaseClient();
  toast('Đã lưu cấu hình Supabase','success');
  loginPage('Đã thay đổi kết nối. Vui lòng đăng nhập lại.');
}
function confirmPullFromSupabase(){
  confirmAction('Tải bản dữ liệu mới nhất từ Supabase? Nếu còn thay đổi chưa lưu, thao tác sẽ bị chặn.', async ()=>{
    closeModal();
    if(await pullStateFromSupabase(false))render();
  });
}

}
const SUPABASE_SQL = `Mở tệp auth-setup.sql trong cùng thư mục với ứng dụng. Sao lưu dữ liệu và làm theo HUONG-DAN-TAI-KHOAN.md trước khi chạy SQL.`;

/* ---------------- DEMO DATA GENERATION ---------------- */
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rand(0,arr.length-1)]; }
function generateDemoData(){

/* ---------------- CALCULATION ENGINE ---------------- */
function getPlatform(id){ return state.platforms.find(p=>p.id===id); }
function getProduct(id){ return state.products.find(p=>p.id===id); }
function getKoc(id){ return state.kocs.find(k=>k.id===id); }
function getCampaign(id){ return state.campaigns.find(c=>c.id===id); }
function getKocGroup(id){ return state.kocGroups.find(g=>g.id===id); }
function getEmployee(id){ return state.employees.find(e=>e.id===id); }

function kocCommissionPctFor(order){
  if(!order.kocId) return 0;
  const bk = state.bookings.find(b=>b.kocId===order.kocId && b.productId===order.productId);
  return bk ? bk.commissionPct : 10;
}

// Full computed financials for a single order (always computed, aggregation decides inclusion by status)
function calcOrder(order){
  const platform = getPlatform(order.platformId) || {paymentFeePct:0};
  const product = getProduct(order.productId) || {costPrice:0, platformFeePct:0, platformManagementFee:0};
  const grossRevenue = (order.sellPrice||0) * (order.qty||0);
  const netRevenue = Math.max(0, grossRevenue - (order.discount||0));
  const platformFee = netRevenue * (product.platformFeePct||0) / 100;
  const managementFee = (product.platformManagementFee||0) * (order.qty||0);
  const paymentFee = netRevenue * (platform.paymentFeePct||0) / 100;
  const kocPct = kocCommissionPctFor(order);
  const kocCommission = netRevenue * kocPct / 100;
  const adsCost = order.adsCostAllocated || 0;
  const shippingFee = order.shippingFeeSeller || 0;
  const netReceived = netRevenue - platformFee - managementFee - paymentFee - shippingFee;
  const cogs = (product.costPrice||0) * (order.qty||0);
  const grossProfit = netReceived - cogs;
  const netProfit = netReceived - cogs - kocCommission - adsCost;
  const margin = safeDiv(netProfit, netRevenue) * 100;
  return {grossRevenue,netRevenue,platformFee,managementFee,paymentFee,kocCommission,adsCost,shippingFee,netReceived,cogs,grossProfit,netProfit,margin};
}
function orderCashAmount(order){
  if(!order?.cashAccountId) return 0;
  if(order.actualCashReceived===null||order.actualCashReceived===undefined||order.actualCashReceived==='') return Math.max(0,calcOrder(order).netReceived);
  const entered=Number(order.actualCashReceived);
  return Number.isFinite(entered)&&entered>=0?entered:Math.max(0,calcOrder(order).netReceived);
}
function syncOrderCashPosting(oldOrder,newOrder){
  ensureFinanceState();
  const oldAccount=oldOrder?.cashAccountId?state.cashAccounts.find(a=>a.id===oldOrder.cashAccountId):null;
  const oldAmount=Number(oldOrder?.cashPostedAmount||0);
  if(oldAccount&&oldAmount){oldAccount.balance=Number(oldAccount.balance||0)-oldAmount;oldAccount.updatedAt=new Date().toISOString();}
  const newAccount=newOrder?.cashAccountId?state.cashAccounts.find(a=>a.id===newOrder.cashAccountId):null;
  const newAmount=newAccount?orderCashAmount(newOrder):0;
  if(newAccount&&newAmount){newAccount.balance=Number(newAccount.balance||0)+newAmount;newAccount.updatedAt=new Date().toISOString();}
  if(newOrder) newOrder.cashPostedAmount=newAmount;
}
function isCounted(order){ return order.status==='success'; }

function filterOrders(orders, f){
  f = f||{};
  return orders.filter(o=>{
    if(f.dateFrom && o.date < f.dateFrom) return false;
    if(f.dateTo && o.date > f.dateTo) return false;
    if(f.platformId && f.platformId!=='all' && o.platformId!==f.platformId) return false;
    if(f.productId && o.productId!==f.productId) return false;
    if(f.kocId && o.kocId!==f.kocId) return false;
    if(f.kocGroupId){ const k=getKoc(o.kocId); if(!k || k.groupId!==f.kocGroupId) return false; }
    if(f.campaignId && o.campaignId!==f.campaignId) return false;
    if(f.status && f.status!=='all' && o.status!==f.status) return false;
    if(f.search){
      const s=f.search.toLowerCase();
      const prod=getProduct(o.productId);
      const hay=(o.code+' '+o.customer+' '+o.sku+' '+(prod?prod.name:'')).toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}
function filterExpenses(expenses,f){
  f=f||{};
  return expenses.filter(e=>{
    if(f.dateFrom && e.date<f.dateFrom) return false;
    if(f.dateTo && e.date>f.dateTo) return false;
    if(f.platformId && f.platformId!=='all' && e.platformId && e.platformId!==f.platformId) return false;
    return true;
  });
}

function dateRangeFor(preset){
  const today = todayISO();
  switch(preset){
    case 'today': return {from:today,to:today};
    case '7d': return {from:addDays(today,-6),to:today};
    case '30d': return {from:addDays(today,-29),to:today};
    case 'this_month':{ const d=new Date(); return {from:localDateISO(new Date(d.getFullYear(),d.getMonth(),1)), to:today}; }
    case 'last_month':{ const d=new Date(); const first=new Date(d.getFullYear(),d.getMonth()-1,1); const last=new Date(d.getFullYear(),d.getMonth(),0); return {from:localDateISO(first), to:localDateISO(last)}; }
    case 'this_quarter':{ const d=new Date(); const q=Math.floor(d.getMonth()/3); const first=new Date(d.getFullYear(),q*3,1); return {from:localDateISO(first), to:today}; }
    case 'this_year':{ const d=new Date(); return {from:localDateISO(new Date(d.getFullYear(),0,1)), to:today}; }
    default: return {from:addDays(today,-29),to:today};
  }
}
function prevRange(from,to){
  const span = daysBetween(from,to)+1;
  return {from:addDays(from,-span), to:addDays(from,-1)};
}

function aggregateOrders(orders){
  let grossRevenue=0,netRevenue=0,cogs=0,platformFee=0,managementFee=0,paymentFee=0,kocCommission=0,adsCost=0,shippingFee=0,netReceived=0,netProfit=0,grossProfit=0;
  let totalOrders=orders.length, successOrders=0, returnOrders=0, cancelOrders=0;
  orders.forEach(o=>{
    if(o.status==='return') returnOrders++;
    if(o.status==='cancelled') cancelOrders++;
    if(isCounted(o)){
      successOrders++;
      const c=calcOrder(o);
      grossRevenue+=c.grossRevenue; netRevenue+=c.netRevenue; cogs+=c.cogs; platformFee+=c.platformFee; managementFee+=c.managementFee;
      paymentFee+=c.paymentFee; kocCommission+=c.kocCommission; adsCost+=c.adsCost; shippingFee+=c.shippingFee;
      netReceived+=c.netReceived; grossProfit+=c.grossProfit; netProfit+=c.netProfit;
    }
  });
  return {grossRevenue,netRevenue,cogs,platformFee,managementFee,paymentFee,kocCommission,adsCost,shippingFee,netReceived,grossProfit,netProfit,
    totalOrders,successOrders,returnOrders,cancelOrders, margin: safeDiv(netProfit,netRevenue)*100};
}

  const pr = prevRange(filters.dateFrom, filters.dateTo);

  const prev = aggregateOrders(prevOrders);

  const expenses = filterExpenses(state.expenses, filters);
  const fixedCost = expenses.filter(e=>!e.isVariable).reduce((s,e)=>s+e.amount,0);
  const otherVarCost = expenses.filter(e=>e.isVariable).reduce((s,e)=>s+e.amount,0);
  const totalCost = cur.cogs + cur.platformFee + cur.managementFee + cur.paymentFee + cur.kocCommission + cur.adsCost + cur.shippingFee + fixedCost + otherVarCost;
  const netProfitFinal = cur.netProfit - fixedCost - otherVarCost;

  const adsSpend = state.ads.filter(a=>a.date>=filters.dateFrom && a.date<=filters.dateTo && (filters.platformId==='all'||!filters.platformId||a.platformId===filters.platformId)).reduce((s,a)=>s+a.cost,0);
  const adsRevenue = state.ads.filter(a=>a.date>=filters.dateFrom && a.date<=filters.dateTo && (filters.platformId==='all'||!filters.platformId||a.platformId===filters.platformId)).reduce((s,a)=>s+a.revenue,0);
  const roas = safeDiv(adsRevenue, adsSpend + cur.adsCost);

  function pctChange(c,p){ if(!p) return c>0?100:0; return safeDiv(c-p,p)*100; }

  return {

      {key:'totalOrders', title:'Tổng đơn hàng', value:cur.totalOrders, change:pctChange(cur.totalOrders,prev.totalOrders), icon:'orders', grad:'var(--grad-3)', isCount:true},

      {key:'returnOrders', title:'Đơn hoàn', value:cur.returnOrders, change:pctChange(cur.returnOrders,prev.returnOrders), icon:'refund', grad:'var(--grad-3)', isCount:true, invert:true},
      {key:'cancelOrders', title:'Đơn hủy', value:cur.cancelOrders, change:pctChange(cur.cancelOrders,prev.cancelOrders), icon:'x', grad:'var(--grad-3)', isCount:true, invert:true},
      {key:'cogs', title:'Giá vốn hàng bán', value:cur.cogs, change:pctChange(cur.cogs,prev.cogs), icon:'cogs', grad:'var(--grad-2)', invert:true},
      {key:'totalCost', title:'Tổng chi phí', value:totalCost, change:0, icon:'expense', grad:'var(--grad-2)', invert:true},
      {key:'adsCost', title:'Chi phí quảng cáo', value:adsSpend+cur.adsCost, change:0, icon:'marketing', grad:'var(--grad-3)', invert:true},

      {key:'platformFee', title:'Phí sàn', value:cur.platformFee, change:0, icon:'settlement', grad:'var(--grad-2)', invert:true},
      {key:'managementFee', title:'Phí quản lý sàn', value:cur.managementFee, change:0, icon:'settlement', grad:'var(--grad-2)', invert:true},

function computeProductUnitEconomics(product){
  const nonNegative=value=>{const number=Number(value);return Number.isFinite(number)&&number>0?number:0;};
  const sellPrice=nonNegative(product?.sellPrice);
  const costPrice=nonNegative(product?.costPrice);
  const platformFeePct=Math.min(100,nonNegative(product?.platformFeePct));
  const platformFeePerUnit=sellPrice*platformFeePct/100;
  const managementFeePerUnit=nonNegative(product?.platformManagementFee);
  const adsCostPerUnit=nonNegative(product?.adsCostPerUnit);
  const totalCostPerUnit=costPrice+platformFeePerUnit+managementFeePerUnit+adsCostPerUnit;
  const unitProfit=sellPrice-totalCostPerUnit;
  const unitMargin=sellPrice>0?unitProfit/sellPrice*100:0;
  return {sellPrice,costPrice,platformFeePct,platformFeePerUnit,managementFeePerUnit,adsCostPerUnit,totalCostPerUnit,unitProfit,unitMargin};
}
function computeProductMetrics(filters){
  const orders = filterOrders(state.orders, filters);
  return state.products.map(p=>{
    const po = orders.filter(o=>o.productId===p.id && isCounted(o));
    let revenue=0,cogs=0,profit=0,qty=0,platformFee=0,kocCost=0,adsCost=0;
    po.forEach(o=>{ const c=calcOrder(o); revenue+=c.netRevenue; cogs+=c.cogs; profit+=c.netProfit; qty+=o.qty; platformFee+=c.platformFee+c.paymentFee; kocCost+=c.kocCommission; adsCost+=c.adsCost; });
    const margin = safeDiv(profit,revenue)*100;
    return {product:p, revenue, cogs, profit, qty, platformFee, kocCost, adsCost, margin,...computeProductUnitEconomics(p)};
  });
}

function computeKocMetrics(filters){
  const orders = filterOrders(state.orders, filters);
  return state.kocs.map(k=>{
    const ko = orders.filter(o=>o.kocId===k.id && isCounted(o));
    let revenue=0,commission=0;
    ko.forEach(o=>{ const c=calcOrder(o); revenue+=c.netRevenue; commission+=c.kocCommission; });
    const bks = state.bookings.filter(b=>b.kocId===k.id);
    const bookingCost = bks.reduce((s,b)=>s+(b.priceBooking||0),0);
    const sampleCost = bks.length * 150000; // simplified sample cost estimate
    const otherCost = state.expenses.filter(e=>e.kocId===k.id).reduce((s,e)=>s+e.amount,0);
    const totalCost = commission + bookingCost + sampleCost + otherCost;
    const profit = revenue - totalCost;
    const roas = safeDiv(revenue, totalCost);
    const roi = safeDiv(profit, totalCost)*100;
    const orderCount = ko.length;
    const cpa = safeDiv(totalCost, orderCount);
    const aov = safeDiv(revenue, orderCount);
    return {koc:k, revenue, commission, bookingCost, sampleCost, otherCost, totalCost, profit, roas, roi, orderCount, cpa, aov};
  });
}

function computeKocScore(kocMetricsList){
  const w = state.settings.kocScoring;
  const maxRevenue = Math.max(1,...kocMetricsList.map(m=>m.revenue));
  const maxOrders = Math.max(1,...kocMetricsList.map(m=>m.orderCount));
  const maxRoas = Math.max(0.001,...kocMetricsList.map(m=>m.roas));
  const maxRoi = Math.max(0.001,...kocMetricsList.map(m=>Math.max(0,m.roi)));
  const maxEng = Math.max(0.001,...kocMetricsList.map(m=>m.koc.engagement||0));
  return kocMetricsList.map(m=>{
    const revN = safeDiv(m.revenue,maxRevenue)*100;
    const ordN = safeDiv(m.orderCount,maxOrders)*100;
    const roasN = safeDiv(m.roas,maxRoas)*100;
    const roiN = safeDiv(Math.max(0,m.roi),maxRoi)*100;
    const engN = safeDiv(m.koc.engagement||0,maxEng)*100;
    const convN = ordN; // conversion proxy
    const score = (revN*w.revenue + ordN*w.orders + roasN*w.roas + roiN*w.roi + engN*w.engagement + convN*w.conversion)/100;
    let tier='Không hiệu quả', tierColor='b-red';
    if(score>=80){tier='Xuất sắc';tierColor='b-green';}
    else if(score>=65){tier='Tốt';tierColor='b-green';}
    else if(score>=50){tier='Trung bình';tierColor='b-yellow';}
    else if(score>=30){tier='Yếu';tierColor='b-yellow';}
    else {tier='Không hiệu quả'; tierColor='b-red';}
    return Object.assign({},m,{score:Math.round(score),tier,tierColor});
  });
}

function computeCampaignMetrics(filters){
  const orders = filterOrders(state.orders, filters);
  return state.campaigns.map(camp=>{
    const co = orders.filter(o=>o.campaignId===camp.id && isCounted(o));
    let revenue=0,commission=0;
    co.forEach(o=>{ const c=calcOrder(o); revenue+=c.netRevenue; commission+=c.kocCommission; });
    const ads = state.ads.filter(a=>a.campaign===camp.id);
    const adsCost = ads.reduce((s,a)=>s+a.cost,0);
    const adsRevenue = ads.reduce((s,a)=>s+a.revenue,0);
    const totalCost = commission + adsCost;
    const totalRevenue = revenue + adsRevenue;
    const profit = totalRevenue - totalCost;
    const roas = safeDiv(totalRevenue, totalCost);
    const roi = safeDiv(profit, totalCost)*100;
    const kocSet = new Set(co.map(o=>o.kocId).filter(Boolean));
    return {campaign:camp, revenue:totalRevenue, cost:totalCost, profit, roas, roi, orders:co.length+ads.reduce((s,a)=>s+a.orders,0), kocCount:kocSet.size, adsCost, adsRevenue};
  });
}

function computeSettlement(filters){
  return state.platforms.map(pl=>{
    const orders = filterOrders(state.orders, Object.assign({},filters,{platformId:pl.id}));
    const succ = orders.filter(isCounted);
    let revenue=0,platformFee=0,managementFee=0,paymentFee=0,shippingFee=0,netReceived=0;
    succ.forEach(o=>{ const c=calcOrder(o); revenue+=c.netRevenue; platformFee+=c.platformFee; managementFee+=c.managementFee; paymentFee+=c.paymentFee; shippingFee+=c.shippingFee; netReceived+=c.netReceived; });
    const returns = orders.filter(o=>o.status==='return').reduce((s,o)=>s+(o.sellPrice*o.qty-o.discount),0);
    const adjustment = 0;
    const shouldReceive = netReceived - returns + adjustment;
    const actualReceived = netReceived; // assume equal unless adjustments entered
    const diff = actualReceived - shouldReceive;
    return {platform:pl, revenue, platformFee, managementFee, paymentFee, shippingFee, returns, adjustment, shouldReceive, actualReceived, diff};
  });
}

function computeCashFlow(filters){
  const settlement = computeSettlement(filters);
  const cashIn = settlement.reduce((s,x)=>s+x.actualReceived,0);
  const expenses = filterExpenses(state.expenses, filters);
  const cashOutExpenses = expenses.reduce((s,e)=>s+e.amount,0);
  const orders = filterOrders(state.orders,filters).filter(isCounted);
  const cogsOut = orders.reduce((s,o)=>s+calcOrder(o).cogs,0);
  const kocOut = orders.reduce((s,o)=>s+calcOrder(o).kocCommission,0);
  const adsOut = orders.reduce((s,o)=>s+calcOrder(o).adsCost,0) + state.ads.filter(a=>a.date>=filters.dateFrom&&a.date<=filters.dateTo).reduce((s,a)=>s+a.cost,0);
  const cashOut = cashOutExpenses + cogsOut + kocOut + adsOut;
  const net = cashIn - cashOut;
  return {cashIn, cashOut, net, breakdown:{cogsOut,kocOut,adsOut,cashOutExpenses}};
}

function emptyState(msg,onclickFn,btnLabel){
  return `<div class="card empty-state">${icon('info',30)}<div style="margin-bottom:14px">${msg}</div><button class="btn btn-primary" onclick="${onclickFn}">${btnLabel}</button></div>`;
}
function setOrderFilter(key,val){ if(key!=='page') mainState.orders.page=1; mainState.orders[key]=val; render(); }
function toggleOrderSelection(id,checked){
  const selected = new Set(mainState.orders.selected||[]);
  if(checked) selected.add(id); else selected.delete(id);
  mainState.orders.selected = [...selected];
  render();
}
function getCurrentOrderPageIds(){
  const s=mainState.orders;
  const filters={dateFrom:s.dateFrom,dateTo:s.dateTo,platformId:s.platformId==='all'?null:s.platformId,status:s.status,search:s.search};
  const list=filterOrders(state.orders,filters).sort((a,b)=>b.date.localeCompare(a.date));
  const totalPages=Math.max(1,Math.ceil(list.length/s.pageSize));
  s.page=Math.min(s.page,totalPages);
  return list.slice((s.page-1)*s.pageSize,s.page*s.pageSize).map(o=>o.id);
}
function toggleOrderSelectAll(checked){
  const selected=new Set(mainState.orders.selected||[]);
  getCurrentOrderPageIds().forEach(id=>checked?selected.add(id):selected.delete(id));
  mainState.orders.selected=[...selected];
  render();
}
function clearOrderSelection(){ mainState.orders.selected=[]; render(); }
function bulkUpdateOrderStatus(){
  const ids=mainState.orders.selected||[];
  if(!ids.length){ toast('Vui lòng chọn ít nhất một phiếu','warning'); return; }
  const status=document.getElementById('bulkOrderStatus')?.value;
  if(!status){ toast('Vui lòng chọn trạng thái cần chuyển','warning'); return; }
  state.orders.forEach(o=>{ if(ids.includes(o.id)) o.status=status; });
  mainState.orders.selected=[];
  saveData(); render();
  toast(`Đã chuyển trạng thái ${ids.length} phiếu sang ${ORDER_STATUS_LABEL[status]}`,'success');
}
function bulkDeleteOrders(){
  const ids=mainState.orders.selected||[];
  if(!ids.length){ toast('Vui lòng chọn ít nhất một phiếu','warning'); return; }
  confirmAction(`Xóa ${ids.length} mục doanh thu đã chọn? Dữ liệu liên quan sẽ được cập nhật lại.`, ()=>{
    const selected=new Set(ids);
    state.orders.filter(o=>selected.has(o.id)).forEach(o=>syncOrderCashPosting(o,null));
    state.orders=state.orders.filter(o=>!selected.has(o.id));
    mainState.orders.selected=[];
    saveData(); render();
    toast(`Đã xóa ${ids.length} mục doanh thu`,'success');
  });
}

function submitOrderForm(id){
  const form = document.getElementById('orderForm');
  const fd = new FormData(form);
  const code = fd.get('code').trim();
  if(!code){ toast('Vui lòng nhập mã đơn','error'); return; }
  const qty = parseInt(fd.get('qty'));
  const sellPrice = parseFloat(fd.get('sellPrice'));
  const discount = parseFloat(fd.get('discount')||0);
  if(qty<=0){ toast('Số lượng phải lớn hơn 0','error'); return; }
  if(sellPrice<0 || discount<0){ toast('Giá trị không được âm','error'); return; }
  if(discount > sellPrice*qty){ toast('Giảm giá không được lớn hơn tổng giá bán','error'); return; }
  const productId = fd.get('productId') || null;
  const product = productId ? getProduct(productId) : null;
  const cashAccountId=fd.get('cashAccountId');
  if(!cashAccountId||!state.cashAccounts.some(a=>a.id===cashAccountId)){toast('Vui lòng chọn quỹ hoặc tài khoản nhận doanh thu','error');return;}
  const actualCashRaw=String(fd.get('actualCashReceived')||'').trim();
  const actualCashReceived=actualCashRaw===''?null:Number(actualCashRaw);
  if(actualCashReceived!==null&&(!Number.isFinite(actualCashReceived)||actualCashReceived<0)){toast('Số tiền thực nhận không hợp lệ','error');return;}
  const data = {
    code, date: fd.get('date'), platformId: fd.get('platformId'), customer: fd.get('customer').trim(),
    productId, sku: product ? product.sku : '', qty, sellPrice, discount,
    shippingFeeSeller: parseFloat(fd.get('shippingFeeSeller')||0), adsCostAllocated: parseFloat(fd.get('adsCostAllocated')||0),
    kocId: fd.get('kocId')||null, campaignId: fd.get('campaignId')||null, status: fd.get('status'),
    refundReason: fd.get('refundReason')||'',
    cashAccountId, actualCashReceived,
  };
  let orderObj;
  if(id){
    orderObj = state.orders.find(o=>o.id===id);
    const oldOrder={...orderObj};
    Object.assign(orderObj, data);
    syncOrderCashPosting(oldOrder,orderObj);
  } else {
    orderObj = Object.assign({id:uid('ord')}, data);
    state.orders.push(orderObj);
    syncOrderCashPosting(null,orderObj);
  }
  saveData();
  closeModal();
  toast(id? 'Cập nhật doanh thu thành công':'Thêm doanh thu thành công','success');
  render();
}

function handleImportOrders(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'binary'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      let added=0, errors=0;
      rows.forEach(r=>{
        const sku = String(r.SKU||r.sku||'').trim();
        const product = sku ? state.products.find(p=>p.sku===sku) : null;
        const sourceText = String(r['Nguồn']||r.Sàn||r.platform||'').trim();
        const source = sourceText==='Dịch vụ'
          ? {id:ORDER_SERVICE_SOURCE_ID}
          : (state.platforms.find(p=>p.name===sourceText) || state.platforms[0]);
        if((sku && !product) || (!r['Mã đơn'] && !r.code)){ errors++; return; }
        state.orders.push({
          id:uid('ord'), code:String(r['Mã đơn']||r.code), date: r['Ngày']||r.date||todayISO(), platformId:source.id,
          customer:String(r['Khách hàng']||r.customer||''), productId:product?product.id:null, sku:product?product.sku:'',
          qty: parseInt(r['Số lượng']||r.qty||1), sellPrice: parseFloat(r['Giá bán']||r.sellPrice||(product?product.sellPrice:0)),
          discount: parseFloat(r['Giảm giá']||r.discount||0), shippingFeeSeller:0, adsCostAllocated:0,
          kocId:null, campaignId:null, status: r['Trạng thái']||r.status||'success', refundReason:'',
        });
        added++;
      });
      saveData(); render();
      toast(`Import thành công ${added} dòng doanh thu${errors?', bỏ qua '+errors+' dòng lỗi':''}`, errors? 'warning':'success');
    }catch(err){ toast('Lỗi import: '+err.message,'error'); }
  };
  reader.readAsBinaryString(file);
}

function submitProductForm(id){
  const fd = new FormData(document.getElementById('productForm'));
  const sku = fd.get('sku').trim(); const name=fd.get('name').trim();
  if(!sku || !name){ toast('Vui lòng nhập đầy đủ SKU và tên sản phẩm','error'); return; }
  if(!id && state.products.some(p=>p.sku===sku)){ toast('SKU đã tồn tại','error'); return; }
  const platformFeePct = parseFloat(fd.get('platformFeePct')||0);
  if(platformFeePct<0||platformFeePct>100){ toast('Phí sàn phải trong khoảng 0-100%','error'); return; }
  const data = {sku,name,category:fd.get('category'),platformId:fd.get('platformId'),importPrice:parseFloat(fd.get('importPrice')||0),costPrice:parseFloat(fd.get('costPrice')||0),sellPrice:parseFloat(fd.get('sellPrice')||0),platformFeePct,platformManagementFee:parseFloat(fd.get('platformManagementFee')||0),adsCostPerUnit:parseFloat(fd.get('adsCostPerUnit')||0),status:fd.get('status')};
  if([data.importPrice,data.costPrice,data.sellPrice,data.platformManagementFee,data.adsCostPerUnit,platformFeePct].some(v=>!Number.isFinite(v)||v<0)){ toast('Giá và các loại phí phải là số từ 0 trở lên','error'); return; }
  if(id){
    const p=getProduct(id); Object.assign(p,data);
  } else {
    const np = Object.assign({id:uid('prod')},data);
    state.products.push(np);
  }
  saveData(); closeModal(); render();
  toast(id?'Cập nhật sản phẩm thành công':'Thêm sản phẩm thành công','success');
}
function deleteProduct(id){
  const inUse = state.orders.some(o=>o.productId===id);
  confirmAction(inUse? 'Sản phẩm này đang có trong dữ liệu doanh thu. Xóa vẫn tiếp tục?':'Bạn có chắc muốn xóa sản phẩm này?', ()=>{
    state.products = state.products.filter(p=>p.id!==id);
    saveData(); render(); toast('Đã xóa sản phẩm','success');
  });
}
function handleImportProducts(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload=(e)=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      let added=0;
      rows.forEach(r=>{
        const sku=String(r.SKU||r.sku||'').trim(); if(!sku) return;
        if(state.products.some(p=>p.sku===sku)) return;
        state.products.push({id:uid('prod'),sku,name:String(r['Tên sản phẩm']||r.name||sku),category:state.categories[0]?.id,platformId:state.platforms[0].id,importPrice:parseFloat(r['Giá nhập']||0),costPrice:parseFloat(r['Giá vốn']||r.costPrice||0),sellPrice:parseFloat(r['Giá bán']||r.sellPrice||0),platformFeePct:parseFloat(r['Phí sàn (%)']||r.platformFeePct||0),platformManagementFee:parseFloat(r['Phí quản lý sàn']||r.platformManagementFee||0),adsCostPerUnit:parseFloat(r['Chi phí quảng cáo/SP']||r['Chi phí quảng cáo']||r.adsCostPerUnit||0),status:'active'});
        added++;
      });
      saveData(); render();
      toast('Import thành công '+added+' sản phẩm','success');
    }catch(err){ toast('Lỗi import: '+err.message,'error'); }
  };
  reader.readAsBinaryString(file);
}

mainState.finance = {preset:'30d'};
function payableStatus(p){
  if(p.status==='paid') return 'paid';
  return daysBetween(todayISO(),p.dueDate)<0?'overdue':'pending';
}
function treasuryMetrics(horizonDays=30){
  ensureFinanceState();
  const cash=state.cashAccounts.reduce((s,a)=>s+Number(a.balance||0),0);
  const pending=state.payables.filter(p=>p.status!=='paid');
  const upcoming=pending.filter(p=>daysBetween(todayISO(),p.dueDate)<=horizonDays);
  const due=upcoming.reduce((s,p)=>s+Number(p.amount||0),0);
  const shortage=Math.max(0,due-cash),surplus=Math.max(0,cash-due);
  const nearest=[...pending].sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''))[0]||null;
  return {cash,pending,upcoming,due,shortage,surplus,nearest,coverage:due?Math.min(100,Math.round(cash/due*100)):100};
}
function treasuryDateRange(s){
  const today=todayISO();
  if(s.horizon==='all') return {from:null,to:null,label:'Toàn bộ thời gian'};
  if(s.horizon==='custom'){
    let from=s.from||today,to=s.to||today;
    if(from>to){const temp=from;from=to;to=temp;}
    return {from,to,label:`${fmtDate(from)} – ${fmtDate(to)}`};
  }
  const days=Number(s.horizon)||30;
  return {from:today,to:addDays(today,days),label:`${days} ngày tới`};
}
function treasuryMetricsForRange(range){
  ensureFinanceState();
  const cash=state.cashAccounts.reduce((sum,a)=>sum+Number(a.balance||0),0);
  const pending=state.payables.filter(p=>p.status!=='paid');
  const upcoming=pending.filter(p=>(!range.from||p.dueDate>=range.from)&&(!range.to||p.dueDate<=range.to));
  const due=upcoming.reduce((sum,p)=>sum+Number(p.amount||0),0),shortage=Math.max(0,due-cash),surplus=Math.max(0,cash-due);
  const nearest=[...upcoming].sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''))[0]||null;
  return {cash,pending,upcoming,due,shortage,surplus,nearest,coverage:due?Math.min(100,Math.round(cash/due*100)):100};
}

function treasuryAddMonths(dateStr,months){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr))return '';
 const [year,month,day]=dateStr.split('-').map(Number),target=new Date(Date.UTC(year,month-1+months,1));
 const last=new Date(Date.UTC(target.getUTCFullYear(),target.getUTCMonth()+1,0)).getUTCDate();
 return `${target.getUTCFullYear()}-${String(target.getUTCMonth()+1).padStart(2,'0')}-${String(Math.min(day,last)).padStart(2,'0')}`;
}
function loanPeriodsUntil(firstDue,principalDue){
 if(!firstDue||!principalDue||firstDue>principalDue)return 1;
 let count=0;while(count<120&&treasuryAddMonths(firstDue,count)<=principalDue)count++;
 return Math.max(1,count);
}
function buildLoanInterestSchedule(total,firstDue,periods,mode){
 if(!total)return [];
 const count=mode==='monthly'?periods:1,each=Math.floor(total/count);
 return Array.from({length:count},(_,i)=>({dueDate:mode==='monthly'?treasuryAddMonths(firstDue,i):firstDue,amount:i===count-1?total-each*(count-1):each}));
}
function syncLoanDatesFromStart(){
 const start=document.getElementById('loanDate').value,principal=document.getElementById('loanPrincipalDue'),first=document.getElementById('loanInterestDue');
 if(!principal.dataset.edited)principal.value=treasuryAddMonths(start,3);
 if(!first.dataset.edited)first.value=treasuryAddMonths(start,1);
 syncLoanInterestPeriods();
}
function syncLoanInterestPeriods(){
 const periods=document.getElementById('loanInterestPeriods');
 if(!periods.dataset.edited&&document.getElementById('loanInterestMode').value==='monthly')periods.value=loanPeriodsUntil(document.getElementById('loanInterestDue').value,document.getElementById('loanPrincipalDue').value);
 updateLoanInterestSchedulePreview();
}
function updateLoanInterestSchedulePreview(){
 const mode=document.getElementById('loanInterestMode').value,total=Number(document.getElementById('loanInterest').value||0),first=document.getElementById('loanInterestDue').value,periods=Number(document.getElementById('loanInterestPeriods').value),due=document.getElementById('loanPrincipalDue').value,start=document.getElementById('loanDate').value;
 document.getElementById('loanPeriodsRow').hidden=mode!=='monthly';
 const preview=document.getElementById('loanInterestPreview');
 if(!Number.isInteger(total)||total<0){preview.textContent='Tiền lãi phải là số nguyên không âm.';return;}
 if(!total){preview.textContent='Chưa nhập tiền lãi; sẽ không tạo kỳ trả lãi.';return;}
 if(!first||first<=start||first>due||mode==='monthly'&&(!Number.isInteger(periods)||periods<1||periods>120||total<periods)){preview.textContent='Kiểm tra ngày trả lãi kỳ đầu, hạn trả gốc và số kỳ (1–120).';return;}
 const schedule=buildLoanInterestSchedule(total,first,periods,mode);
 if(schedule.at(-1).dueDate>due){preview.textContent='Kỳ lãi cuối đang sau ngày phải trả gốc. Hãy điều chỉnh số kỳ hoặc hạn trả gốc.';return;}
 preview.textContent=`${schedule.length} kỳ · Tổng ${formatCurrency(total)}: ${schedule.map((item,i)=>`Kỳ ${i+1} ${fmtDate(item.dueDate)} — ${formatCurrency(item.amount)}`).join(' · ')}`;
}

 openModal({title:'Nhập khoản vay mới',wide:true,bodyHtml:`<div class="insight-box">${icon('info',16)}<p>Tiền vay được cộng vào quỹ và tạo khoản phải trả gốc. <b>Tiền lãi dự kiến là tổng lãi của cả kỳ vay</b>; nếu chọn hằng tháng, ứng dụng chia thành từng kỳ riêng để theo dõi đã trả và còn phải trả.</p></div><div class="form-grid2"><div class="form-row"><label>Bên cho vay *</label><input class="input" id="loanLender" placeholder="Ngân hàng / Cá nhân"></div><div class="form-row"><label>Số tiền vay *</label><input class="input" type="number" min="1" step="1" id="loanPrincipal"></div><div class="form-row"><label>Ngày nhận tiền *</label><input class="input" type="date" id="loanDate" value="${today}" onchange="syncLoanDatesFromStart()"></div><div class="form-row"><label>Tiền nhận vào quỹ *</label><select class="select" id="loanCashAccount">${state.cashAccounts.map(a=>`<option value="${a.id}">${escapeHtml(a.name)} · ${formatCurrency(a.balance)}</option>`).join('')}</select></div><div class="form-row"><label>Ngày phải trả gốc *</label><input class="input" type="date" id="loanPrincipalDue" value="${treasuryAddMonths(today,3)}" onchange="this.dataset.edited='1';syncLoanInterestPeriods()"></div><div class="form-row"><label>Tổng tiền lãi dự kiến</label><input class="input" type="number" min="0" step="1" id="loanInterest" value="0" oninput="updateLoanInterestSchedulePreview()"></div><div class="form-row"><label>Cách trả lãi</label><select class="select" id="loanInterestMode" onchange="syncLoanInterestPeriods()"><option value="monthly">Hằng tháng cùng ngày</option><option value="single">Trả một lần</option></select></div><div class="form-row"><label>Ngày trả lãi / kỳ đầu</label><input class="input" type="date" id="loanInterestDue" value="${treasuryAddMonths(today,1)}" onchange="this.dataset.edited='1';syncLoanInterestPeriods()"></div><div class="form-row" id="loanPeriodsRow"><label>Số kỳ trả lãi</label><input class="input" type="number" min="1" max="120" step="1" id="loanInteres function submitLoan(){
 const lender=document.getElementById('loanLender').value.trim(),principal=Number(document.getElementById('loanPrincipal').value),disbursementDate=document.getElementById('loanDate').value,cashAccountId=document.getElementById('loanCashAccount').value,principalDueDate=document.getElementById('loanPrincipalDue').value,interestAmount=Number(document.getElementById('loanInterest').value||0),interestDueDate=document.getElementById('loanInterestDue').value,interestMode=document.getElementById('loanInterestMode').value,interestPeriods=Number(document.getElementById('loanInterestPeriods').value),note=document.getElementById('loanNote').value.trim();
 const account=state.cashAccounts.find(a=>a.id===cashAccountId);
 if(!lender||!Number.isSafeInteger(principal)||principal<=0||!disbursementDate||!principalDueDate||principalDueDate<disbursementDate||!account){toast('Kiểm tra bên cho vay, số tiền nguyên dương, quỹ nhận và hạn trả gốc','error');return;}
 if(!Number.isSafeInteger(interestAmount)||interestAmount<0||!['monthly','single'].includes(interestMode)){toast('Tổng tiền lãi dự kiến không hợp lệ','error');return;}
 if(interestAmount>0&&(!interestDueDate||interestDueDate<=disbursementDate||interestDueDate>principalDueDate)){toast('Ngày trả lãi kỳ đầu phải sau ngày nhận tiền và không sau hạn trả gốc','error');return;}
 if(interestAmount>0&&interestMode==='monthly'&&(!Number.isInteger(interestPeriods)||interestPeriods<1||interestPeriods>120||interestAmount<interestPeriods)){toast('Số kỳ trả lãi phải từ 1 đến 120 và mỗi kỳ có số tiền dương','error');return;}
 const schedule=buildLoanInterestSchedule(interestAmount,interestDueDate,interestPeriods,interestMode);
 if(schedule.some(item=>!item.dueDate||item.dueDate>principalDueDate||item.amount<=0)){toast('Lịch trả lãi vượt hạn trả gốc hoặc số tiền mỗi kỳ không hợp lệ','error');return;}
 const loanId=uid('loan'),principalPayableId=uid('pay'),interestPayableIds=schedule.map(()=>uid('pay')),createdAt=new Date().toISOString();

 state.loans.push(loan);
 account.balance=Number(account.balance||0)+principal;account.updatedAt=createdAt;
 state.payables.push({id:principalPayableId,name:`Trả gốc khoản vay - ${lender}`,type:'loan_principal',amount:principal,creditor:lender,dueDate:principalDueDate,note:note||'Tạo tự động từ khoản vay',status:'pending',paidDate:'',cashAccountId:'',loanId,createdAt});
 schedule.forEach((item,i)=>state.payables.push({id:interestPayableIds[i],name:`Trả lãi khoản vay - ${lender}${interestMode==='monthly'?` · kỳ ${i+1}/${schedule.length}`:''}`,type:'loan_interest',amount:item.amount,creditor:lender,dueDate:item.dueDate,note:note||'Tạo tự động từ khoản vay',status:'pending',paidDate:'',cashAccountId:'',loanId,interestPeriod:i+1,createdAt}));
 saveData();closeModal();render();toast(`Đã cộng ${formatCurrency(principal)} vào ${account.name} và tạo ${schedule.length} kỳ lãi`,'success');
}

// Validate every delta before mutating balances, including edits across two funds.
function syncExpenseCashPosting(oldExpense,newExpense){
  const deltas=new Map();
  if(oldExpense?.cashPostedAmount>0){
    if(!state.cashAccounts.some(a=>a.id===oldExpense.cashAccountId))throw Error('Không tìm thấy quỹ của chi phí cũ');
    deltas.set(oldExpense.cashAccountId,Number(oldExpense.cashPostedAmount));
  }
  if(newExpense?.cashPostedAmount>0)deltas.set(newExpense.cashAccountId,(deltas.get(newExpense.cashAccountId)||0)-Number(newExpense.cashPostedAmount));
  const changes=[...deltas].map(([id,delta])=>{
    const account=state.cashAccounts.find(a=>a.id===id);
    if(!account||!Number.isFinite(delta)||!Number.isFinite(Number(account.balance)))throw Error('Nguồn quỹ hoặc số dư không hợp lệ');
    const balance=Number(account.balance)+delta;
    if(delta<0&&balance<0)throw Error('Quỹ '+account.name+' không đủ số dư');
    return {account,balance};
  });
  changes.forEach(({account,balance})=>{account.balance=balance;account.updatedAt=new Date().toISOString();});
}
function submitExpenseForm(id){
  const form=document.getElementById('expenseForm');if(!form.reportValidity())return;
  const fd=new FormData(form),amount=Number(fd.get('amount')),old=id?state.expenses.find(e=>e.id===id):null;
  if(id&&!old){toast('Không tìm thấy chi phí','error');return;}
  if(!Number.isFinite(amount)||amount<=0||!fd.get('date')){toast('Nhập ngày và số tiền lớn hơn 0','error');return;}
  const mode=fd.get('postingMode');
  const data={...old,id:id||uid('exp'),amount,cashAccountId:fd.get('cashAccountId')||'',cashPostedAmount:0,payableId:'',postingMode:mode};
  for(const key of ['date','docNo','content','type','platformId','campaignId','kocId','productId','note'])data[key]=fd.get(key)||'';
  if(!getExpenseTypes().some(t=>t.id===data.type)){toast('Vui lòng chọn phân loại chi phí hợp lệ','error');return;}
  data.content=data.content.trim();
  data.isVariable=getExpenseTypes().find(t=>t.id===data.type)?.variable||false;
  if(!['direct','payable','historical'].includes(mode)){toast('Cách ghi nhận không hợp lệ','error');return;}
  if(mode==='payable'){
    const p=state.payables.find(x=>x.id===fd.get('payableId'));
    if(!p||p.status!=='paid'||!p.cashAccountId||p.type==='loan_principal'||Number(p.amount)!==amount||state.expenses.some(x=>x.id!==id&&x.payableId===p.id)){toast('Chọn khoản đã trả hợp lệ, chưa liên kết và nhập đúng số tiền','error');return;}
    data.cashAccountId=p.cashAccountId;data.payableId=p.id;
  }
  if((mode!=='historical'||data.cashAccountId)&&!state.cashAccounts.some(a=>a.id===data.cashAccountId)){toast('Vui lòng chọn nguồn quỹ hợp lệ trong Kế hoạch chi & nợ','error');return;}
  if(mode==='direct')data.cashPostedAmount=amount;
  try{syncExpenseCashPosting(old,data);}catch(err){toast(err.message,'error');return;}
  if(old)Object.assign(old,data);else state.expenses.push(data);
  saveData();closeModal();render();toast('Đã lưu chi phí và cập nhật quỹ','success');
}
function deleteExpense(id){
  const e=state.expenses.find(x=>x.id===id);if(!e)return;
  confirmAction(e.cashPostedAmount>0?`Xóa chi phí và hoàn ${formatCurrency(e.cashPostedAmount)} về quỹ gốc?`:'Xóa chi phí này? Số dư quỹ không thay đổi; khoản thanh toán liên kết vẫn được giữ.',()=>{
    const current=state.expenses.find(x=>x.id===id);if(!current)return;
    try{syncExpenseCashPosting(current,null);}catch(err){toast(err.message,'error');return;}
    state.expenses=state.expenses.filter(x=>x.id!==id);saveData();render();toast('Đã xóa chi phí','success');
  });
}

/* ========================================================
   PAGE: BREAK-EVEN
   ======================================================== */
function pageBreakeven(){
  const filters = dateRangeFor('this_month');
  const f2 = {dateFrom:filters.from,dateTo:filters.to,platformId:'all'};
  const orders = filterOrders(state.orders,f2).filter(isCounted);
  const avgSell = safeDiv(orders.reduce((s,o)=>s+o.sellPrice*o.qty,0), orders.reduce((s,o)=>s+o.qty,0))||0;
  let varCostPerOrder=0;
  if(orders.length){ varCostPerOrder = orders.reduce((s,o)=>{const c=calcOrder(o); return s+c.platformFee+c.paymentFee+c.kocCommission+c.adsCost+c.shippingFee+c.cogs;},0)/orders.length; }
  const aov = safeDiv(orders.reduce((s,o)=>s+o.sellPrice*o.qty-o.discount,0), orders.length);
  const fixedCost = state.expenses.filter(e=>!e.isVariable && e.date>=filters.from && e.date<=filters.to).reduce((s,e)=>s+e.amount,0);
  const contributionMargin = aov - varCostPerOrder;
  const breakEvenOrders = safeDiv(fixedCost, contributionMargin);
  const breakEvenRevenue = breakEvenOrders * aov;
  const currentOrders = orders.length;
  const progress = Math.min(100, safeDiv(currentOrders, breakEvenOrders||1)*100);
  return `<div class="page-title">Phân tích Break-Even</div><div class="page-sub">Điểm hòa vốn dựa trên dữ liệu tháng này</div>
  <div class="grid grid-3" style="margin-bottom:16px">
    ${kpiCard({title:'Contribution Margin/đơn',value:contributionMargin,icon:'gauge',grad:'var(--grad-1)',change:0})}
    ${kpiCard({title:'Break-even (số đơn)',value:breakEvenOrders,isCount:true,icon:'orders',grad:'var(--grad-2)',change:0})}
    ${kpiCard({title:'Break-even (doanh thu)',value:breakEvenRevenue,icon:'revenue',grad:'var(--grad-3)',change:0})}
  </div>
  <div class="card">
    <div class="section-title">Tiến độ đạt điểm hòa vốn tháng này</div>
    <div class="progress-outer"><div class="progress-inner" style="width:${progress}%"></div></div>
    <div class="muted" style="margin-top:8px;font-size:12.5px">${formatNumber(currentOrders)} / ${formatNumber(Math.round(breakEvenOrders))} đơn (${progress.toFixed(0)}%)</div>
    <hr class="sep">
    <div class="stat-line"><span class="muted">AOV (giá trị đơn hàng trung bình)</span><b>${formatCurrency(aov)}</b></div>
    <div class="stat-line"><span class="muted">Chi phí biến đổi / đơn</span><b>${formatCurrency(varCostPerOrder)}</b></div>
    <div class="stat-line"><span class="muted">Chi phí cố định tháng này</span><b>${formatCurrency(fixedCost)}</b></div>
  </div>`;
}

function toggleKocSelection(id,checked){

  render();
}
function getVisibleKocIds(){

  return scored.filter(m=>{
    if(s.group!=='all' && m.koc.groupId!==s.group) return false;
    if(s.search){ const q=s.search.toLowerCase(); if(!(m.koc.name.toLowerCase().includes(q)||m.koc.username.toLowerCase().includes(q))) return false; }
    return true;
  }).map(m=>m.koc.id);
}
function toggleKocSelectAll(checked){

function bulkUpdateKocStatus(){

  if(!status){ toast('Vui lòng chọn trạng thái cần chuyển','warning'); return; }
  state.kocs.forEach(k=>{ if(ids.includes(k.id)){ k.status=status; k.dateLast=todayISO(); } });
  mainState.koc_list.selected=[];
  saveData(); render();
  toast(`Đã chuyển trạng thái ${ids.length} KOC sang ${KOC_STATUS_LABEL[status]}`,'success');
}
function bulkDeleteKocs(){
  const ids=mainState.koc_list.selected||[];
  if(!ids.length){ toast('Vui lòng chọn ít nhất một KOC','warning'); return; }

}

/* ========================================================
   PAGE: MARKETING — GOOGLE DRIVE → FACEBOOK PAGE
   ======================================================== */
mainState.marketing={info:null,loaded:false,loading:false,error:'',preview:null};
const MARKETING_STATUS={queued:'Chờ đăng',publishing:'Đang đăng',published:'Đã đăng ảnh',submitted:'Đã gửi video, Facebook đang xử lý',failed:'Đăng lỗi',uncertain:'Cần kiểm tra trên Page',unsupported:'Không hỗ trợ',skipped:'Đã bỏ qua'};
async function marketingApi(action,payload={}){
 const client=ensureSupabaseClient();if(!client)throw new Error('Chưa kết nối Supabase');
 const {data,error}=await client.functions.invoke('ecom-marketing',{body:{action,store_id:getSupabaseConfig().storeId||'default',...payload}});
 if(error){let detail=error.message;try{const body=await error.context?.json();detail=body?.error||detail;}catch(_e){}throw new Error(detail);}
 if(data?.error)throw new Error(data.error);
 return data;
}
async function loadMarketing(){
 const s=mainState.marketing;if(s.loading)return;s.loading=true;s.error='';render();
 try{s.info=await marketingApi('status');s.loaded=true;}catch(e){s.error=e.message;s.loaded=true;}
 finally{s.loading=false;if(currentRoute==='marketing')render();}
}
afterRenderHooks.marketing=()=>{if(!mainState.marketing.loaded&&!mainState.marketing.loading)loadMarketing();};
async function connectMarketingFacebook(){
 if(!isAdmin())return;
 const popup=window.open('about:blank','_blank');if(popup)popup.opener=null;
 try{
  const result=await marketingApi('connect_facebook');
  if(popup)popup.location.href=result.url;else window.location.href=result.url;
  toast('Hoàn tất cấp quyền trong tab Facebook, rồi bấm Làm mới trạng thái','warning');
 }catch(e){if(popup)popup.close();toast(e.message,'error');}
}
async function saveMarketingConfig(){
 if(!isAdmin())return;
 const folder=document.getElementById('marketingFolder')?.value.trim()||'',page=document.getElementById('marketingPage')?.value||'',auto=!!document.getElementById('marketingAuto')?.checked;
 try{
  const data=await marketingApi('save_config',{drive_folder:folder,facebook_page_id:page,auto_enabled:auto});
  mainState.marketing.info=data;mainState.marketing.preview=null;render();
  toast(auto?'Đã bật tự đăng cho tệp mới':'Đã lưu cấu hình Marketing','success');
 }catch(e){toast(e.message,'error');}
}
async function previewMarketingDrive(){
 try{const result=await marketingApi('preview');mainState.marketing.preview=result.files||[];render();}
 catch(e){toast(e.message,'error');}
}
function pageMarketing(){
 const s=mainState.marketing,info=s.info;
 const setup='<p class="muted">Để chạy tự động khi bạn đóng trình duyệt, cần cài Edge Function và lịch quét Supabase theo tệp <b>HUONG-DAN-MARKETING.md</b> trong thư mục CODEX. Không nhập mã truy cập Google/Facebook vào tệp HTML.</p>';
 if(!info)return `<div class="page-title">Marketing · Tự đăng Facebook Page</div><div class="card"><div class="section-title">${s.loading?'Đang kiểm tra kết nối':'Chưa sẵn sàng'}</div>${setup}${s.error?`<p style="color:var(--red)">${escapeHtml(s.error)}</p>`:''}<button class="btn" onclick="loadMarketing()">Kiểm tra lại</button></div>`;

/* ========================================================
   PAGE: ADS / MARKETING
   ======================================================== */
function pageAds(){
  const ads = state.ads.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const totalCost = ads.reduce((s,a)=>s+a.cost,0);
  const totalRevenue = ads.reduce((s,a)=>s+a.revenue,0);
  const totalClicks = ads.reduce((s,a)=>s+a.clicks,0);
  const totalImpr = ads.reduce((s,a)=>s+a.impressions,0);
  const totalOrders = ads.reduce((s,a)=>s+a.orders,0);
  const roas = safeDiv(totalRevenue,totalCost); const roi = safeDiv(totalRevenue-totalCost,totalCost)*100;
  const cpc = safeDiv(totalCost,totalClicks); const cpa=safeDiv(totalCost,totalOrders);
  const ctr = safeDiv(totalClicks,totalImpr)*100; const cvr = safeDiv(totalOrders,totalClicks)*100;
  return `<div class="page-title">Chi phí quảng cáo</div><div class="page-sub">Quản lý ngân sách và hiệu quả quảng cáo</div>
  <div class="grid grid-kpi" style="margin-bottom:16px">
    ${kpiCard({title:'Tổng chi phí Ads',value:totalCost,icon:'marketing',grad:'var(--grad-2)',change:0,invert:true})}
    ${kpiCard({title:'Doanh thu từ Ads',value:totalRevenue,icon:'revenue',grad:'var(--grad-1)',change:0})}
    ${kpiCard({title:'ROAS',value:roas,isRatio:true,icon:'roas',grad:'var(--grad-3)',change:0})}
    ${kpiCard({title:'ROI',value:roi,isPct:true,icon:'roi',grad:'var(--grad-1)',change:0})}
    ${kpiCard({title:'CPC',value:cpc,icon:'money',grad:'var(--grad-2)',change:0,invert:true})}
    ${kpiCard({title:'CPA',value:cpa,icon:'cac',grad:'var(--grad-2)',change:0,invert:true})}
    ${kpiCard({title:'CTR',value:ctr,isPct:true,icon:'gauge',grad:'var(--grad-3)',change:0})}
    ${kpiCard({title:'CVR',value:cvr,isPct:true,icon:'gauge',grad:'var(--grad-1)',change:0})}
  </div>
  <div class="filter-row"><button class="btn btn-primary" onclick="openAdModal()">${icon('plus',14)} Thêm chi phí quảng cáo</button></div>
  ${!ads.length? emptyState('Chưa có dữ liệu quảng cáo','openAdModal()','+ Thêm quảng cáo'):`
  <div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Campaign</th><th>Sản phẩm</th><th>Chi phí</th><th>Doanh thu</th><th>Đơn</th><th>Click</th><th>Impression</th><th>ROAS</th><th></th></tr></thead><tbody>
  ${ads.map(a=>{const camp=getCampaign(a.campaign); const p=getProduct(a.productId); const r=safeDiv(a.revenue,a.cost);
    return `<tr><td>${fmtDate(a.date)}</td><td>${camp?escapeHtml(camp.name):'—'}</td><td>${p?escapeHtml(p.name):''}</td><td>${formatCurrency(a.cost)}</td><td>${formatCurrency(a.revenue)}</td><td>${a.orders}</td><td>${formatNumber(a.clicks)}</td><td>${formatNumber(a.impressions)}</td><td>${r.toFixed(2)}x</td><td><div class="row-actions"><button onclick="deleteAd('${a.id}')">${icon('trash',14)}</button></div></td></tr>`}).join('')}
  </tbody></table></div>`}
  `;
}
function openAdModal(){
  openModal({title:'Thêm chi phí quảng cáo', bodyHtml:`
  <form id="adForm">
    <div class="form-grid2">
      <div class="form-row"><label>Ngày</label><input class="input" type="date" name="date" value="${todayISO()}"></div>
      <div class="form-row"><label>Campaign</label><select class="select" name="campaign">${state.campaigns.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select></div>
      <div class="form-row"><label>Sản phẩm</label><select class="select" name="productId">${state.products.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select></div>
      <div class="form-row"><label>Sàn</label><select class="select" name="platformId">${state.platforms.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
      <div class="form-row"><label>Chi phí *</label><input class="input" type="number" min="0" name="cost" value="0"></div>
      <div class="form-row"><label>Doanh thu</label><input class="input" type="number" min="0" name="revenue" value="0"></div>
      <div class="form-row"><label>Số đơn</label><input class="input" type="number" min="0" name="orders" value="0"></div>
      <div class="form-row"><label>Click</label><input class="input" type="number" min="0" name="clicks" value="0"></div>
      <div class="form-row"><label>Impression</label><input class="input" type="number" min="0" name="impressions" value="0"></div>
    </div>
  </form>`, footerHtml:`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="submitAdForm()">${icon('save',14)} Lưu</button>`});
}
function submitAdForm(){
  const fd = new FormData(document.getElementById('adForm'));
  const data = {date:fd.get('date'),campaign:fd.get('campaign'),platformId:fd.get('platformId'),productId:fd.get('productId'),cost:parseFloat(fd.get('cost')||0),revenue:parseFloat(fd.get('revenue')||0),orders:parseInt(fd.get('orders')||0),clicks:parseInt(fd.get('clicks')||0),impressions:parseInt(fd.get('impressions')||0)};
  if(data.clicks>data.impressions && data.impressions>0){ toast('Click không được lớn hơn Impression','error'); return; }
  state.ads.push(Object.assign({id:uid('ad')},data));
  saveData(); closeModal(); render(); toast('Thêm chi phí quảng cáo thành công','success');
}
function deleteAd(id){ confirmAction('Xóa dữ liệu quảng cáo này?', ()=>{ state.ads=state.ads.filter(a=>a.id!==id); saveData(); render(); toast('Đã xóa','success'); }); }
