mainState.reports = {tab:'revenue'};
function pageReports(){
  const s = mainState.reports;
  const tabs=[['revenue','Doanh thu'],['profit','Lợi nhuận'],['product','Sản phẩm'],['koc','KOC'],['platform','Theo sàn'],['cashflow','Dòng tiền']];
  const filters = dateRangeForFull();
  let body='';
  if(s.tab==='revenue'){
    const orders = state.orders.filter(isCounted);
    const byMonth={}; orders.forEach(o=>{ const m=o.date.slice(0,7); byMonth[m]=(byMonth[m]||0)+calcOrder(o).netRevenue; });
    const months = Object.keys(byMonth).sort();
    body = `<div class="table-wrap"><table><thead><tr><th>Tháng</th><th>Doanh thu</th></tr></thead><tbody>${months.map(m=>`<tr><td>${m}</td><td>${formatCurrency(byMonth[m])}</td></tr>`).join('')||'<tr><td colspan="2" class="muted" style="text-align:center;padding:20px">Chưa có dữ liệu</td></tr>'}</tbody></table></div>`;
  } else if(s.tab==='profit'){
    const d = computeDashboard(dateRangeFor('this_year'));
    body = `<div class="card">
      <div class="stat-line"><span>Doanh thu</span><b>${formatCurrency(d.cur.netRevenue)}</b></div>
      <div class="stat-line"><span>Giá vốn</span><b>${formatCurrency(d.cur.cogs)}</b></div>
      <div class="stat-line"><span>Phí (sàn+TT+VC)</span><b>${formatCurrency(d.cur.platformFee+d.cur.paymentFee+d.cur.shippingFee)}</b></div>
      <div class="stat-line"><span>Marketing (KOC+Ads)</span><b>${formatCurrency(d.cur.kocCommission+d.cur.adsCost)}</b></div>
      <div class="stat-line"><span>Chi phí cố định</span><b>${formatCurrency(d.fixedCost)}</b></div>
      <div class="stat-line"><span style="font-weight:700">Lợi nhuận</span><b style="color:var(--green)">${formatCurrency(d.netProfitFinal)}</b></div>
    </div>`;
  } else if(s.tab==='product'){
    const pm = computeProductMetrics(filters).sort((a,b)=>b.revenue-a.revenue);
    body = `<div class="table-wrap"><table><thead><tr><th>Top</th><th>Sản phẩm</th><th>Doanh thu</th><th>Lợi nhuận</th><th>Đã bán</th></tr></thead><tbody>${pm.slice(0,15).map((m,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(m.product.name)}</td><td>${formatCurrency(m.revenue)}</td><td>${formatCurrency(m.profit)}</td><td>${m.qty}</td></tr>`).join('')||'<tr><td colspan="5" class="muted" style="text-align:center;padding:20px">Chưa có dữ liệu</td></tr>'}</tbody></table></div>`;
  } else if(s.tab==='koc'){
    const km = computeKocScore(computeKocMetrics(filters)).sort((a,b)=>b.revenue-a.revenue);
    body = `<div class="table-wrap"><table><thead><tr><th>Top</th><th>KOC</th><th>Nhóm</th><th>Doanh thu</th><th>ROI</th><th>Score</th></tr></thead><tbody>${km.slice(0,15).map((m,i)=>{const g=getKocGroup(m.koc.groupId); return `<tr><td>${i+1}</td><td>${escapeHtml(m.koc.name)}</td><td>${g?g.name:''}</td><td>${formatCurrency(m.revenue)}</td><td>${formatPct(m.roi)}</td><td>${m.score}</td></tr>`}).join('')||'<tr><td colspan="6" class="muted" style="text-align:center;padding:20px">Chưa có dữ liệu</td></tr>'}</tbody></table></div>`;
  } else if(s.tab==='platform'){
    const platData = state.platforms.map(pl=>{
      const orders = filterOrders(state.orders,{platformId:pl.id}).filter(isCounted);
      let revenue=0,cogs=0,fees=0,profit=0;
      orders.forEach(o=>{const c=calcOrder(o); revenue+=c.netRevenue; cogs+=c.cogs; fees+=c.platformFee+c.paymentFee; profit+=c.netProfit;});
      return {pl,revenue,cogs,fees,profit,orders:orders.length,margin:safeDiv(profit,revenue)*100};
    });
    body = `<div class="table-wrap"><table><thead><tr><th>Sàn</th><th>Đơn</th><th>Doanh thu</th><th>Giá vốn</th><th>Phí</th><th>Lợi nhuận</th><th>Margin</th></tr></thead><tbody>${platData.map(x=>`<tr><td><b>${x.pl.name}</b></td><td>${x.orders}</td><td>${formatCurrency(x.revenue)}</td><td>${formatCurrency(x.cogs)}</td><td>${formatCurrency(x.fees)}</td><td>${formatCurrency(x.profit)}</td><td>${formatPct(x.margin)}</td></tr>`).join('')}</tbody></table></div>`;
  } else if(s.tab==='cashflow'){
    const cf = computeCashFlow(dateRangeFor('this_year'));
    body = `<div class="card"><div class="stat-line"><span>Tiền vào</span><b>${formatCurrency(cf.cashIn)}</b></div><div class="stat-line"><span>Tiền ra</span><b>${formatCurrency(cf.cashOut)}</b></div><div class="stat-line"><span style="font-weight:700">Dòng tiền thuần</span><b>${formatCurrency(cf.net)}</b></div></div>`;
  }
  return `<div class="page-title">Báo cáo</div><div class="page-sub">Hệ thống báo cáo tổng hợp toàn diện</div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="tab-btn ${s.tab===k?'active':''}" onclick="mainState.reports.tab='${k}';render()">${l}</button>`).join('')}</div>
  <div class="filter-row"><button class="btn" onclick="exportReportExcel()">${icon('download',14)} Export báo cáo</button></div>
  ${body}`;
}
function exportReportExcel(){
  const s=mainState.reports;
  let rows=[];
  if(s.tab==='product') rows = computeProductMetrics(dateRangeForFull()).map(m=>({'Sản phẩm':m.product.name,'Doanh thu':m.revenue,'Lợi nhuận':m.profit,'Đã bán':m.qty}));
  else if(s.tab==='koc') rows = computeKocMetrics(dateRangeForFull()).map(m=>({'KOC':m.koc.name,'Doanh thu':m.revenue,'ROI':m.roi.toFixed(1)}));
  else { toast('Vui lòng chọn báo cáo Sản phẩm hoặc KOC để export chi tiết','warning'); return; }
  const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Report');
  XLSX.writeFile(wb,'bao-cao-'+s.tab+'-'+todayISO()+'.xlsx');
  toast('Export báo cáo thành công','success');
}

function pageOrganization(){

function saveDepartment(id){
 const form=document.getElementById('departmentForm');if(!form.reportValidity())return;
 const fd=new FormData(form),owners=[...new Set(fd.getAll('owners').map(x=>String(x).trim()).filter(Boolean))],data={};
 ['name','backup','roles','responsibilities','outputs','kpis','notes'].forEach(k=>data[k]=String(fd.get(k)||'').trim());data.owners=owners;data.owner=owners[0]||'';
 if(!data.name){toast('Vui lòng nhập tên bộ phận','error');return;}
 if(id){const d=orgDept(id);if(!d)return;Object.assign(d,data);}else state.organization.departments.push({id:uid('dept'),...data});
 saveData();closeModal();render();toast('Đã lưu phân công; người phụ trách trong quy trình được cập nhật','success');
}
function openWorkflowModal(id){

function saveWorkflow(id){const name=document.getElementById('workflowName').value.trim();if(!name){toast('Nhập tên quy trình','error');return;}const w=state.organization.workflows.find(x=>x.id===id);if(w)w.name=name;else{const obj={id:uid('workflow'),name,steps:[]};state.organization.workflows.push(obj);mainState.organization.workflow=obj.id;}mainState.organization.tab='workflows';saveData();closeModal();render();}
function openHandoffModal(workflowId,id){

function saveHandoff(workflowId,id){
 const form=document.getElementById('handoffForm');if(!form.reportValidity())return;
 const data=Object.fromEntries(new FormData(form));Object.keys(data).forEach(k=>data[k]=data[k].trim());
 if(Object.values(data).some(v=>!v)||!orgDept(data.from)||!orgDept(data.to)){toast('Nhập đủ thông tin và bộ phận hợp lệ','error');return;}
 const w=state.organization.workflows.find(x=>x.id===workflowId);if(!w)return;
 if(id){const step=w.steps.find(x=>x.id===id);if(!step)return;Object.assign(step,data);}else w.steps.push({id:uid('step'),...data});saveData();closeModal();render();toast('Đã lưu bước bàn giao','success');
}
function moveHandoff(workflowId,id,delta){const w=state.organization.workflows.find(x=>x.id===workflowId);if(!w)return;const i=w.steps.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=w.steps.length)return;[w.steps[i],w.steps[j]]=[w.steps[j],w.steps[i]];saveData();render();}
function deleteHandoff(workflowId,id){confirmAction('Xóa bước bàn giao này khỏi quy trình?',()=>{const w=state.organization.workflows.find(x=>x.id===workflowId);if(!w)return;w.steps=w.steps.filter(x=>x.id!==id);saveData();render();});}

function selectedProductIds(){return (mainState.products.selected||[]).filter(id=>state.products.some(p=>p.id===id));}
function toggleProductSelection(id,on){const ids=new Set(selectedProductIds());on?ids.add(id):ids.delete(id);mainState.products.selected=[...ids];render();}
function toggleAllProducts(on){mainState.products.selected=on?state.products.filter(p=>(mainState.products.category==='all'||p.category===mainState.products.category)&&(!mainState.products.search||(p.name+' '+p.sku).toLowerCase().includes(mainState.products.search.toLowerCase()))).map(p=>p.id):[];render();}
function productHasBusinessLinks(id){
 const product=state.products.find(p=>p.id===id);if(!product)return false;
 return state.orders.some(o=>o.productId===id||o.sku===product.sku)
  ||state.expenses.some(e=>e.productId===id)
  ||state.businessPlans.some(p=>(p.productPlans||[]).some(x=>x.productId===id))
  ||state.bookings.some(b=>b.productId===id)
  ||state.campaigns.some(c=>c.productId===id)
  ||state.ads.some(a=>a.productId===id);
}
function deleteSelectedProducts(){
 const ids=selectedProductIds();if(!ids.length)return;
 const protectedIds=ids.filter(productHasBusinessLinks),removable=ids.filter(id=>!protectedIds.includes(id));
 if(!removable.length){toast('Các sản phẩm đã chọn đều có dữ liệu liên kết. Hãy dùng Ngừng bán để giữ lịch sử.','warning');return;}
 confirmAction(`Xóa ${removable.length} sản phẩm chưa có dữ liệu liên kết? ${protectedIds.length} sản phẩm đã có dữ liệu sẽ được giữ lại. Không thể hoàn tác việc xóa.`,()=>{
  const removed=new Set(removable);
  state.products=state.products.filter(p=>!removed.has(p.id));
  mainState.products.selected=protectedIds;
  saveData();render();toast(`Đã xóa ${removable.length} sản phẩm${protectedIds.length?`; giữ lại ${protectedIds.length} sản phẩm có dữ liệu liên kết`:''}`,'success');
 });
}
function applyProductBulk(){
 const ids=selectedProductIds(),action=document.getElementById('productBulkAction').value;if(!ids.length)return;
 const category=document.getElementById('productBulkCategory').value;
 if(action==='category'&&!state.categories.some(c=>c.id===category)){toast('Chọn danh mục đích','error');return;}
 const label=`Áp dụng ${action==='category'?'đổi danh mục':action==='active'?'Hoạt động':'Ngừng bán'} cho ${ids.length} sản phẩm đã chọn?`;

 mainState.products.selected=[];saveData();render();toast('Đã áp dụng thao tác hàng loạt','success');

}
function ensureMindmap(){
 const org=state.organization;
 if(!org.mindmap)org.mindmap={positions:{},edges:org.departments.filter(d=>d.id!=='ceo').map(d=>({id:uid('edge'),from:'ceo',to:d.id,fromSide:'bottom',toSide:'top',style:'orthogonal'}))};
 if(!org.mindmap.positions)org.mindmap.positions={};if(!Array.isArray(org.mindmap.edges))org.mindmap.edges=[];
 org.departments.forEach((d,i)=>{if(!org.mindmap.positions[d.id])org.mindmap.positions[d.id]={x:d.id==='ceo'?440:80+(i%4)*360,y:d.id==='ceo'?40:280+Math.floor((i-1)/4)*240};});
 org.mindmap.edges.forEach(e=>{const sides=inferMapSides(e,org.mindmap);if(!MAP_SIDES.includes(e.fromSide))e.fromSide=sides.fromSide;if(!MAP_SIDES.includes(e.toSide))e.toSide=sides.toSide;if(!['straight','orthogonal'].includes(e.style))e.style='orthogonal';});
 return org.mindmap;
}
const MAP_NODE_W=270,MAP_NODE_H=160,MAP_SIDES=['top','right','bottom','left'];
const MAP_SIDE_LABEL={top:'Mặt trên',right:'Mặt phải',bottom:'Mặt dưới',left:'Mặt trái'};
function inferMapSides(edge,map){const a=map.positions[edge.from],b=map.positions[edge.to];if(!a||!b)return {fromSide:'right',toSide:'left'};const dx=(b.x-a.x),dy=(b.y-a.y);return Math.abs(dx)>=Math.abs(dy)?(dx>=0?{fromSide:'right',toSide:'left'}:{fromSide:'left',toSide:'right'}):(dy>=0?{fromSide:'bottom',toSide:'top'}:{fromSide:'top',toSide:'bottom'});}
function mapPortPoint(id,side){const p=ensureMindmap().positions[id];if(!p)return {x:0,y:0};if(side==='top')return {x:p.x+MAP_NODE_W/2,y:p.y};if(side==='bottom')return {x:p.x+MAP_NODE_W/2,y:p.y+MAP_NODE_H};if(side==='left')return {x:p.x,y:p.y+MAP_NODE_H/2};return {x:p.x+MAP_NODE_W,y:p.y+MAP_NODE_H/2};}
function mapOut(point,side,gap=28){if(side==='top')return {x:point.x,y:point.y-gap};if(side==='bottom')return {x:point.x,y:point.y+gap};if(side==='left')return {x:point.x-gap,y:point.y};return {x:point.x+gap,y:point.y};}
function mapPath(a,b,style='orthogonal',fromSide='right',toSide='left'){
 if(style==='straight')return `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
 const a1=mapOut(a,fromSide),b1=mapOut(b,toSide),fromHorizontal=['left','right'].includes(fromSide),toHorizontal=['left','right'].includes(toSide);let middle='';
 if(fromHorizontal&&toHorizontal){const x=(a1.x+b1.x)/2;middle=`L ${x} ${a1.y} L ${x} ${b1.y}`;}
 else if(!fromHorizontal&&!toHorizontal){const y=(a1.y+b1.y)/2;middle=`L ${a1.x} ${y} L ${b1.x} ${y}`;}
 else if(fromHorizontal)middle=`L ${b1.x} ${a1.y}`;else middle=`L ${a1.x} ${b1.y}`;
 return `M ${a.x} ${a.y} L ${a1.x} ${a1.y} ${middle} L ${b1.x} ${b1.y} L ${b.x} ${b.y}`;
}
function mapGhostPath(ghost){if(ghost.style==='straight')return `M ${ghost.a.x} ${ghost.a.y} L ${ghost.b.x} ${ghost.b.y}`;const horizontal=['left','right'].includes(ghost.fromSide);return horizontal?`M ${ghost.a.x} ${ghost.a.y} L ${ghost.b.x} ${ghost.a.y} L ${ghost.b.x} ${ghost.b.y}`:`M ${ghost.a.x} ${ghost.a.y} L ${ghost.a.x} ${ghost.b.y} L ${ghost.b.x} ${ghost.b.y}`;}
function mapLineStyle(){return document.getElementById('mapLineStyle')?.value||'orthogonal';}
function mindmapMarkup(){
 const map=ensureMindmap();return `<div class="card"><p class="muted">Mỗi ô có bốn điểm nối ở bốn mặt. Chọn kiểu đường thẳng hoặc vuông góc, rồi kéo từ một điểm nối sang đúng điểm nối của ô khác; cũng có thể bấm lần lượt hai điểm. Bấm đường nối để sửa kiểu và hai mặt bám.</p><div class="filter-row"><span class="badge b-purple" id="mapHint">${map.edges.length} đường nối</span><label>Kiểu đường mới <select class="select" id="mapLineStyle" style="width:auto"><option value="orthogonal">Vuông góc</option><option value="straight">Thẳng</option></select></label><button class="btn" onclick="mapConnectFrom=null;document.getElementById('mapHint').textContent='Đã hủy nối';drawMapEdges()">Hủy nối</button><div class="map-zoom-controls" aria-label="Điều chỉnh mức phóng đại mindmap"><button class="btn" onclick="setMindmapZoom(mindmapZoom()-.1)" aria-label="Thu nhỏ mindmap">−</button><span class="map-zoom-value" id="mapZoomValue" aria-live="polite">100%</span><button class="btn" onclick="setMindmapZoom(mindmapZoom()+.1)" aria-label="Phóng to mindmap">+</button><button class="btn" onclick="setMindmapZoom(1)">100%</button><button class="btn" onclick="fitMindmap()">Toàn cảnh</button></div></div><div class="map-scroll"><div class="map-zoom-space" id="mapZoomSpace"><div class="map-surface" id="mapSurface" tabindex="0" aria-label="Mindmap kéo thả"><svg id="mapEdges" class="map-edges" width="2600" height="2000"></svg>${state.organization.departments.map(d=>{const p=map.positions[d.id];return `<article class="map-node" data-dept="${d.id}" style="left:${p.x}px;top:${p.y}px"><button class="map-drag" data-move="${d.id}" aria-label="Di chuyển ${escapeHtml(d.name)}">⠿ Di chuyển</button><button class="map-title" onclick="openDepartmentModal('${d.id}')">${escapeHtml(d.name)}</button>${orgOwnersBadges(d)}${MAP_SIDES.map(side=>`<button class="map-port" data-connect="${d.id}" data-side="${side}" aria-label="Nối ${MAP_SIDE_LABEL[side].toLowerCase()} của ${escapeHtml(d.name)}" title="${MAP_SIDE_LABEL[side]}">●</button>`).join('')}</article>`;}).join('')}</div></div></div></div>`;
}
function mindmapZoom(){return Number(mainState.organization.zoom)||1;}
function applyMindmapZoom(){
 const board=document.getElementById('mapSurface'),space=document.getElementById('mapZoomSpace');if(!board||!space)return;
 const zoom=mindmapZoom();board.style.transform=`scale(${zoom})`;space.style.width=2600*zoom+'px';space.style.height=2000*zoom+'px';
 const label=document.getElementById('mapZoomValue');if(label)label.textContent=Math.round(zoom*100)+'%';
}
function setMindmapZoom(value){
 const scroller=document.querySelector('.map-scroll');if(!scroller)return;
 const oldZoom=mindmapZoom(),centerX=(scroller.scrollLeft+scroller.clientWidth/2)/oldZoom,centerY=(scroller.scrollTop+scroller.clientHeight/2)/oldZoom;
 mainState.organization.zoom=Math.max(.1,Math.min(1.75,Math.round(value*100)/100));applyMindmapZoom();
 scroller.scrollLeft=centerX*mindmapZoom()-scroller.clientWidth/2;scroller.scrollTop=centerY*mindmapZoom()-scroller.clientHeight/2;
}
function fitMindmap(){
 const scroller=document.querySelector('.map-scroll'),positions=state.organization.departments.map(d=>ensureMindmap().positions[d.id]).filter(Boolean);if(!scroller||!positions.length)return;
 const left=Math.min(...positions.map(p=>p.x)),top=Math.min(...positions.map(p=>p.y)),right=Math.max(...positions.map(p=>p.x+270)),bottom=Math.max(...positions.map(p=>p.y+160));
 const zoom=Math.max(.1,Math.min(1.75,(scroller.clientWidth-32)/(right-left),(scroller.clientHeight-32)/(bottom-top)));
 mainState.organization.zoom=Math.round(zoom*100)/100;applyMindmapZoom();
 scroller.scrollLeft=((left+right)/2)*mindmapZoom()-scroller.clientWidth/2;scroller.scrollTop=((top+bottom)/2)*mindmapZoom()-scroller.clientHeight/2;
}
let mapConnectFrom=null;
function drawMapEdges(ghost){
 const svg=document.getElementById('mapEdges');if(!svg)return;const map=ensureMindmap();
 svg.innerHTML=`<defs><marker id="mapArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker></defs>`+map.edges.filter(e=>orgDept(e.from)&&orgDept(e.to)).map(e=>`<path tabindex="0" role="button" aria-label="Sửa đường nối ${escapeHtml(orgDept(e.from).name)} đến ${escapeHtml(orgDept(e.to).name)}" data-edge="${e.id}" d="${mapPath(mapPortPoint(e.from,e.fromSide),mapPortPoint(e.to,e.toSide),e.style,e.fromSide,e.toSide)}" marker-end="url(#mapArrow)"/>`).join('')+(ghost?`<path d="${mapGhostPath(ghost)}" style="stroke:#22d3ee;stroke-dasharray:8 5;pointer-events:none"/>`:'');
}
function createMapEdge(from,to,fromSide='right',toSide='left',style=mapLineStyle()){if(!orgDept(from)||!orgDept(to)||from===to||!MAP_SIDES.includes(fromSide)||!MAP_SIDES.includes(toSide))return;const map=ensureMindmap();if(map.edges.some(e=>e.from===from&&e.to===to)){toast('Đường nối giữa hai bộ phận này đã tồn tại; bấm vào đường để chỉnh sửa','warning');return;}map.edges.push({id:uid('edge'),from,to,fromSide,toSide,style});saveData();drawMapEdges();document.getElementById('mapHint').textContent=map.edges.length+' đường nối · Đã lưu';}
function openMapEdge(id){const e=ensureMindmap().edges.find(x=>x.id===id);if(!e)return;const sideOptions=selected=>MAP_SIDES.map(side=>`<option value="${side}" ${side===selected?'selected':''}>${MAP_SIDE_LABEL[side]}</option>`).join('');openModal({title:'Chỉnh sửa đường nối',bodyHtml:`<div class="form-row"><label>Kiểu đường</label><select class="select" id="mapEdgeStyle"><option value="orthogonal" ${e.style==='orthogonal'?'selected':''}>Vuông góc</option><option value="straight" ${e.style==='straight'?'selected':''}>Thẳng</option></select></div><div class="form-grid2"><div class="form-row"><label>Mặt ra · ${escapeHtml(orgDept(e.from)?.name||'')}</label><select class="select" id="mapEdgeFromSide">${sideOptions(e.fromSide)}</select></div><div class="form-row"><label>Mặt vào · ${escapeHtml(orgDept(e.to)?.name||'')}</label><select class="select" id="mapEdgeToSide">${sideOptions(e.toSide)}</select></div></div>`,footerHtml:`<button class="btn" onclick="deleteMapEdge('${id}')">Xóa đường</button><button class="btn" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveMapEdge('${id}')">Lưu đường nối</button>`});}
function saveMapEdge(id){const e=ensureMindmap().edges.find(x=>x.id===id);if(!e)return;e.style=document.getElementById('mapEdgeStyle').value;e.fromSide=document.getElementById('mapEdgeFromSide').value;e.toSide=document.getElementById('mapEdgeToSide').value;saveData();closeModal();render();toast('Đã cập nhật đường nối','success');}
function deleteMapEdge(id){confirmAction('Xóa đường nối này? Các bộ phận vẫn được giữ nguyên.',()=>{const map=ensureMindmap();map.edges=map.edges.filter(x=>x.id!==id);saveData();closeModal();render();});}
function bindMindmap(){
 const board=document.getElementById('mapSurface');if(!board)return;drawMapEdges();applyMindmapZoom();let drag=null;
 board.onpointerdown=e=>{const move=e.target.closest('[data-move]'),port=e.target.closest('[data-connect]');if(!move&&!port)return;e.preventDefault();const id=(move||port).dataset[move?'move':'connect'],p=ensureMindmap().positions[id];drag={id,side:port?.dataset.side||'',mode:move?'move':'connect',x:e.clientX,y:e.clientY,old:{...p},moved:false};board.setPointerCapture(e.pointerId);};
 board.onpointermove=e=>{if(!drag)return;const zoom=mindmapZoom(),dx=(e.clientX-drag.x)/zoom,dy=(e.clientY-drag.y)/zoom;drag.moved=drag.moved||Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4;if(drag.mode==='move'){const p=ensureMindmap().positions[drag.id];p.x=Math.max(0,Math.min(2310,drag.old.x+dx));p.y=Math.max(0,Math.min(1800,drag.old.y+dy));const n=board.querySelector(`[data-dept="${drag.id}"]`);n.style.left=p.x+'px';n.style.top=p.y+'px';drawMapEdges();}else{const r=board.getBoundingClientRect();drawMapEdges({a:mapPortPoint(drag.id,drag.side),b:{x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom},fromSide:drag.side,style:mapLineStyle()});}};
 board.onpointerup=e=>{if(!drag)return;const d=drag,targetPort=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-connect]');drag=null;board.releasePointerCapture(e.pointerId);if(d.mode==='move'){if(d.moved){saveData();document.getElementById('mapHint').textContent='Đã lưu vị trí';}return;}const target=targetPort?.dataset.connect,targetSide=targetPort?.dataset.side;if(target&&target!==d.id){createMapEdge(d.id,target,d.side,targetSide);mapConnectFrom=null;}else if(!d.moved){if(mapConnectFrom&&mapConnectFrom.id!==d.id){createMapEdge(mapConnectFrom.id,d.id,mapConnectFrom.side,d.side);mapConnectFrom=null;}else{mapConnectFrom={id:d.id,side:d.side};document.getElementById('mapHint').textContent='Chọn một điểm nối ở mặt của bộ phận đích';}}drawMapEdges();};
 board.onpointercancel=()=>{if(drag?.mode==='move'){ensureMindmap().positions[drag.id]=drag.old;const n=board.querySelector(`[data-dept="${drag.id}"]`);n.style.left=drag.old.x+'px';n.style.top=drag.old.y+'px';}drag=null;drawMapEdges();};
 const edit=e=>{const edge=e.target.closest('[data-edge]');if(edge)openMapEdge(edge.dataset.edge);};
 board.onclick=e=>{if(e.target.closest('[data-edge]'))edit(e);};board.onkeydown=e=>{if(e.key==='Enter'&&e.target.closest('[data-edge]'))edit(e);};
}

function workflowCards(w){

function saveInlineStep(wid,id,field,input){

function reorderWorkflow(wid,source,target){const w=state.organization.workflows.find(x=>x.id===wid);if(!w||source===target)return;const from=w.steps.findIndex(x=>x.id===source),to=w.steps.findIndex(x=>x.id===target);if(from<0||to<0)return;const [item]=w.steps.splice(from,1);w.steps.splice(to,0,item);saveData();render();}
function bindWorkflowDrag(){

 list.onpointerdown=e=>{const handle=e.target.closest('[data-step-drag]');if(!handle)return;document.activeElement?.blur();e.preventDefault();drag={id:handle.dataset.stepDrag,target:null};list.setPointerCapture(e.pointerId);};

const ROUTE_ACCESS={dashboard:'finance',orders:'finance',products:'catalog',revenue:'finance',refunds:'finance',finance:'finance',treasury:'finance',expenses:'finance',profit:'finance',settlement:'finance',cashflow:'finance',breakeven:'finance',business_plans:'planning',organization:'organization',koc_overview:'koc',koc_list:'koc',koc_group:'koc',campaigns:'koc',bookings:'koc',ads:'finance',reports:'admin',settings:'admin',marketing:'admin'};
const KEY_ACCESS={settings:'_shared',platforms:'_shared',categories:'_shared',products:'catalog',orders:'finance',expenses:'finance',cashAccounts:'finance',payables:'finance',loans:'finance',ads:'finance',customExpenseTypes:'finance',deletedExpenseTypeIds:'finance',expenseTypeNames:'finance',kocs:'koc',kocGroups:'koc',campaigns:'koc',bookings:'koc',businessPlans:'planning',organization:'organization',employees:'organization'};
let accessProfile=null,accessUser=null,serverRevision=null,serverSnapshot=null,saveInFlight=false,saveBlocked=false,saveTimer=null,saveMessage='',memberList=null;
function isAdmin(){return accessProfile?.role==='admin';}
function canRead(module){return isAdmin()||['view','edit'].includes(accessProfile?.permissions?.[module]);}
function canEdit(module){return isAdmin()||accessProfile?.permissions?.[module]==='edit';}
function canAccessRoute(route){
 const module=ROUTE_ACCESS[route];if(!module)return false;
 if(module==='admin')return isAdmin();
 if(!canRead(module))return false;
 if(['koc','planning'].includes(module)&&!canRead('finance'))return false;
 return true;
}
function firstAccessibleRoute(){return MENU.flatMap(g=>g.items).map(i=>i.key).find(canAccessRoute)||'';}
function loginPage(message=''){
 const cfg=getSupabaseConfig(),app=document.getElementById('app');
 app.innerHTML=`<main class="auth-screen"><div class="card auth-card"><div class="page-title">ECOM DIGITAL</div><p class="muted">Đăng nhập bằng tài khoản nhân viên đã được quản trị viên cấp quyền.</p>${message?`<div class="insight-box"><p>${escapeHtml(message)}</p></div>`:''}
 <form id="loginForm" onsubmit="event.preventDefault();loginWithPassword()"><div class="form-row"><label>Email</label><input class="input" id="authEmail" type="email" autocomplete="username" required></div><div class="form-row"><label>Mật khẩu</label><input class="input" id="authPassword" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Đăng nhập</button></form>
 ${!cfg?.url||!cfg?.anonKey?`<details><summary>Thiết lập kết nối lần đầu</summary><div class="form-row"><label>Project URL</label><input class="input" id="loginProjectUrl" placeholder="https://project.supabase.co"></div><div class="form-row"><label>Publishable / anon key</label><input class="input" id="loginAnonKey" autocomplete="off"></div><div class="form-row"><label>Mã cửa hàng</label><input class="input" id="loginStoreId" value="default"></div><button class="btn" onclick="saveLoginConfig()">Lưu kết nối</button></details>`:''}
 <p class="muted" style="font-size:12px">Không có tài khoản? Người quản trị tạo email trong Supabase Authentication và cấp quyền trong Cài đặt → Tài khoản & phân quyền.</p></div></main>`;
}
function saveLoginConfig(){const url=document.getElementById('loginProjectUrl')?.value.trim(),anonKey=document.getElementById('loginAnonKey')?.value.trim(),storeId=document.getElementById('loginStoreId')?.value.trim()||'default';if(!url?.startsWith('https://')||!anonKey){loginPage('Cần Project URL HTTPS và publishable/anon key hợp lệ.');return;}setSupabaseConfig({url,anonKey,storeId,autoSync:true});supabaseClient=null;loginPage('Đã lưu kết nối. Hãy đăng nhập.');}
async function loginWithPassword(){
 const email=document.getElementById('authEmail')?.value.trim(),password=document.getElementById('authPassword')?.value;
 const client=ensureSupabaseClient();if(!client){loginPage('Thiếu cấu hình Supabase.');return;}
 try{
  const {error}=await client.auth.signInWithPassword({email,password});
  if(error){loginPage('Đăng nhập không thành công. Kiểm tra email, mật khẩu hoặc tài khoản Supabase.');return;}
  await loadAuthorizedState();
 }catch(e){loginPage('Không kết nối được tới Supabase. Hãy kiểm tra mạng và cấu hình dự án.');}
}
async function loadAuthorizedState(){
 if(accessProfile&&hasPendingChanges()){toast('Hãy lưu hoặc tải bản nháp trước khi tải lại dữ liệu','warning');return false;}
 const client=ensureSupabaseClient();if(!client){loginPage('Thiếu cấu hình Supabase.');return false;}
 const {data:userData,error:userError}=await client.auth.getUser();
 if(userError||!userData?.user){accessProfile=null;accessUser=null;loginPage('Hãy đăng nhập để xem dữ liệu.');return false;}
 accessUser=userData.user;
 const {data,error}=await client.rpc('ecom_read_state',{p_store:getSupabaseConfig().storeId||'default'});
 if(error){accessProfile=null;state=null;loginPage(error.code==='PGRST202'?'Chưa cài đặt tệp auth-setup.sql trên Supabase.':`Tài khoản chưa có quyền hoặc cấu hình chưa hoàn tất: ${error.message}`);return false;}
 accessProfile={role:data.role,permissions:data.permissions||{}};mainState.marketing={info:null,loaded:false,loading:false,error:'',preview:null};serverRevision=Number(data.revision);saveBlocked=false;saveMessage='';supabaseStatus='connected';memberList=null;
 const base=defaultState();base.employees=[];
 state=Object.assign(base,data.data||{});ensureFinanceState();serverSnapshot=JSON.parse(JSON.stringify(state));
 currentRoute=canAccessRoute(window.location.hash.slice(1))?window.location.hash.slice(1):firstAccessibleRoute();
 if(currentRoute){window.location.hash=currentRoute;render();}else document.getElementById('app').innerHTML='<div class="auth-screen"><div class="card auth-card"><h2>Chưa có hạng mục được cấp quyền</h2><button class="btn" onclick="logoutAccount()">Đăng xuất</button></div></div>';
 return true;
}
async function logoutAccount(){if(hasPendingChanges()){toast('Đang có thay đổi chưa đồng bộ. Hãy lưu hoặc tải bản nháp trước khi đăng xuất.','warning');return;}await ensureSupabaseClient()?.auth.signOut();accessProfile=null;accessUser=null;state=null;serverSnapshot=null;serverRevision=null;memberList=null;mainState.marketing={info:null,loaded:false,loading:false,error:'',preview:null};loginPage('Đã đăng xuất.');}
function authorizedPatch(){
 if(!serverSnapshot||!state)return {};
 const patch={};for(const key of Object.keys(KEY_ACCESS))if(JSON.stringify(state[key])!==JSON.stringify(serverSnapshot[key]))patch[key]=state[key];
 return patch;
}
function hasPendingChanges(){return Object.keys(authorizedPatch()).length>0;}
function saveData(){
 if(!accessProfile||!state)return;
 const patch=authorizedPatch();
 const deniedKey=Object.keys(patch).find(key=>{const module=KEY_ACCESS[key];return module==='_shared'?!isAdmin():!canEdit(module);});
 if(deniedKey){
  const defaults=defaultState();
  for(const key of Object.keys(patch))state[key]=JSON.parse(JSON.stringify(serverSnapshot[key]===undefined?defaults[key]:serverSnapshot[key]));
  saveMessage='Thay đổi không thuộc quyền sửa của tài khoản này; đã bỏ thao tác.';toast(saveMessage,'error');render();return;
 }
 saveMessage='Đang lưu thay đổi lên Supabase…';scheduleSupabasePush();
}
function scheduleSupabasePush(){if(saveBlocked||!accessProfile)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>pushStateToSupabase(true),500);}
async function pushStateToSupabase(silent=false){
 if(saveInFlight||saveBlocked||!accessProfile)return;
 const patch=authorizedPatch();if(!Object.keys(patch).length){if(!silent)toast('Không có thay đổi mới','success');return;}
 for(const key of Object.keys(patch)){const module=KEY_ACCESS[key];if(module==='_shared'?!isAdmin():!canEdit(module)){saveMessage='Thay đổi vượt quyền được cấp';render();return;}}
 saveInFlight=true;const cfg=getSupabaseConfig();
 try{
 const {data,error}=await ensureSupabaseClient().rpc('ecom_write_state',{p_store:cfg.storeId||'default',p_revision:serverRevision,p_patch:patch});if(error)throw error;
 serverRevision=Number(data);for(const [key,value] of Object.entries(patch))serverSnapshot[key]=JSON.parse(JSON.stringify(value));saveMessage='Đã lưu lên Supabase';supabaseStatus='connected';
 if(!silent)toast(saveMessage,'success');
 }catch(e){saveBlocked=true;saveMessage=`Chưa lưu lên Supabase: ${e.message}. Xuất bản nháp trước khi tải lại.`;supabaseStatus='error';toast(saveMessage,'error');}
 finally{saveInFlight=false;if(accessProfile&&document.getElementById('pageContent'))render();if(!saveBlocked&&hasPendingChanges())scheduleSupabasePush();}
}
async function pullStateFromSupabase(silent=false){if(hasPendingChanges()){toast('Có thay đổi chưa lưu. Hãy xuất bản nháp trước khi tải lại.','warning');return false;}return loadAuthorizedState();}
async function testSupabaseConnection(){const ok=await loadAuthorizedState();supabaseStatus=ok?'connected':'error';supabaseStatusMsg=ok?'':'Không đọc được dữ liệu bằng tài khoản hiện tại';}
function syncNotice(){return saveMessage&&saveMessage!=='Đã lưu lên Supabase'?`<div class="insight-box" style="margin-bottom:12px"><p>${escapeHtml(saveMessage)} ${saveBlocked?'<button class="btn btn-sm" onclick="exportBackup()">Tải bản nháp JSON</button>':''}</p></div>`:'';}
function lockReadonlyUI(){
 const module=ROUTE_ACCESS[currentRoute];if(isAdmin()||canEdit(module))return;
 const root=document.getElementById('pageContent');if(!root)return;
 const writePattern=/^(open(?:Order|Product|Expense|Loan|CashAccount|Payable|SettlePayable|BusinessPlan|PlanProduct|PlanTask|Koc|Group|Campaign|Booking|Ad|Department|Workflow|Handoff|ExpenseType)Modal|submit|delete|bulk|applyProductBulk|save|update|settle|undo|reset|clearAll|generateDemo|addInline|renameInline|requestDelete|toggleAllProducts|toggleProductSelection|moveHandoff|reorderWorkflow|openBookingModal)/i;
 root.querySelectorAll('button[onclick],input[type="checkbox"][onchange]').forEach(el=>{const action=el.getAttribute('onclick')||el.getAttribute('onchange')||'';if(writePattern.test(action.trim())){el.disabled=true;el.title='Chỉ có quyền xem';}});
 root.querySelectorAll('.map-drag,.map-port,.workflow-handle,.map-edges').forEach(el=>el.style.pointerEvents='none');
 root.querySelectorAll('.workflow-edit input,.workflow-edit textarea,.workflow-edit select').forEach(el=>el.disabled=true);
 root.insertAdjacentHTML('afterbegin','<div class="insight-box"><p>Chế độ chỉ xem. Liên hệ quản trị viên để được cấp quyền sửa.</p></div>');
}
function permissionsPage(){
 const rows=memberList||[];
 return `<div class="card"><div class="section-title">Tài khoản & phân quyền</div><p class="muted">Bước 1: tạo tài khoản email và mật khẩu ở Supabase → Authentication → Users → Add user. Bước 2: nhập đúng email ở đây để cấp quyền. Chỉ tài khoản đã tồn tại trên Supabase mới đăng nhập được.</p><button class="btn" onclick="loadMemberList()">Tải danh sách tài khoản</button>
 ${rows.length?`<div class="table-wrap"><table><thead><tr><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map(m=>`<tr><td>${escapeHtml(m.email)}</td><td>${m.role==='admin'?'Quản trị':'Nhân viên'}</td><td>${m.active?'Đang hoạt động':'Đã khóa'}</td><td><button class="btn btn-sm" onclick="showMemberForm(${escapeHtml(JSON.stringify(m.email))})">Sửa quyền</button></td></tr>`).join('')}</tbody></table></div>`:''}
 <button class="btn btn-primary" onclick="showMemberForm()">+ Cấp quyền cho tài khoản</button></div>`;
}
async function loadMemberList(){if(!isAdmin())return;const {data,error}=await ensureSupabaseClient().rpc('ecom_list_members',{p_store:getSupabaseConfig().storeId||'default'});if(error){toast(error.message,'error');return;}memberList=data;render();}
function showMemberForm(email=''){
 if(!isAdmin())return;const m=memberList?.find(x=>x.email===email),permissions=m?.permissions||{};
 openModal({title:m?'Sửa quyền tài khoản':'Cấp quyền tài khoản đã tạo',wide:true,bodyHtml:`<form id="memberForm"><div class="form-grid2"><div class="form-row"><label>Email tài khoản Supabase *</label><input class="input" type="email" name="email" value="${escapeHtml(email)}" ${m?'readonly':''} required></div><div class="form-row"><label>Vai trò</label><select class="select" name="role"><option value="staff" ${m?.role==='staff'?'selected':''}>Nhân viên</option><option value="admin" ${m?.role==='admin'?'selected':''}>Quản trị viên (toàn quyền)</option></select></div></div><p class="muted">Quyền theo hạng mục. KOC và Kế hoạch cần ít nhất quyền Chỉ xem ở Doanh thu & tài chính để đối chiếu số liệu.</p>${ACCESS_MODULES.map(x=>`<div class="form-row"><label>${escapeHtml(x.name)} <small class="muted">${escapeHtml(x.description)}</small></label><select class="select" name="perm_${x.id}">${[['','Không truy cập'],['view','Chỉ xem'],['edit','Được sửa']].map(([v,label])=>`<option value="${v}" ${permissions[x.id]===v?'selected':''}>${label}</option>`).join('')}</select></div>`).join('')}<label><input type="checkbox" name="active" ${m?.active!==false?'checked':''}> Tài khoản đang hoạt động</label></form>`,footerHtml:`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveMemberForm()">Lưu quyền</button>`});
}
async function saveMemberForm(){const form=document.getElementById('memberForm');if(!form.reportValidity())return;const fd=new FormData(form),permissions={};for(const x of ACCESS_MODULES){const level=fd.get('perm_'+x.id);if(level)permissions[x.id]=level;}if((permissions.koc||permissions.planning)&&!permissions.finance){toast('Cần ít nhất quyền Chỉ xem Doanh thu & tài chính cho KOC hoặc Kế hoạch','error');return;}
 const {error}=await ensureSupabaseClient().rpc('ecom_set_member',{p_store:getSupabaseConfig().storeId||'default',p_email:fd.get('email').trim(),p_role:fd.get('role'),p_permissions:permissions,p_active:fd.has('active')});if(error){toast(error.message,'error');return;}closeModal();toast('Đã lưu quyền tài khoản','success');await loadMemberList();}
window.addEventListener('beforeunload',e=>{if(hasPendingChanges()){e.preventDefault();e.returnValue='';}});

const PAGES = {
  organization:pageOrganization, dashboard:pageDashboard, business_plans:pageBusinessPlans, orders:pageOrders, products:pageProducts, revenue:pageRevenue, refunds:pageRefunds,
  finance:pageFinance, treasury:pageTreasury, expenses:pageExpenses, profit:pageProfit, settlement:pageSettlement, cashflow:pageCashflow, breakeven:pageBreakeven,
  koc_overview:pageKocOverview, koc_list:pageKocList, koc_group:pageKocGroup, campaigns:pageCampaigns, bookings:pageBookings,
  reports:pageReports, settings:pageSettings, marketing:pageMarketing,
};

/* ---------------- INIT ---------------- */
async function init(){
  // No local business data is opened before authentication. The legacy browser cache is never read here.
  loginPage();
  const client=ensureSupabaseClient();
  if(!client)return;
  const {data}=await client.auth.getSession();
  if(data?.session)await loadAuthorizedState();
}
document.addEventListener('DOMContentLoaded', init);
</script>
<script>
(() => {
  const networkStatus=document.getElementById('pwaNetworkStatus');
  const installButton=document.getElementById('pwaInstallButton');
  const updateNotice=document.getElementById('pwaUpdateNotice');
  const updateButton=document.getElementById('pwaUpdateButton');
  let installPrompt=null;
  let refreshing=false;

  function updateNetworkStatus(){
    if(location.protocol==='file:'){
      networkStatus.textContent='Để cài ứng dụng PWA, hãy mở trang qua localhost hoặc tên miền HTTPS.';
      networkStatus.hidden=false;
      return;
    }
    networkStatus.textContent='Thiết bị đang ngoại tuyến. Dữ liệu Supabase chỉ đồng bộ lại khi có Internet.';
    networkStatus.hidden=navigator.onLine;
  }

  window.addEventListener('online',updateNetworkStatus);
  window.addEventListener('offline',updateNetworkStatus);
  updateNetworkStatus();

  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    installPrompt=event;
    installButton.hidden=false;
  });
  installButton.addEventListener('click',async()=>{
    if(!installPrompt)return;
    installButton.hidden=true;
    await installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt=null;
  });
  window.addEventListener('appinstalled',()=>{installPrompt=null;installButton.hidden=true;});

  if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    location.reload();
  });
  window.addEventListener('load',async()=>{
    try{
      const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
      const showUpdate=worker=>{
        if(!worker)return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed'&&navigator.serviceWorker.controller)updateNotice.hidden=false;
        });
      };
      if(registration.waiting)updateNotice.hidden=false;
      registration.addEventListener('updatefound',()=>showUpdate(registration.installing));
      updateButton.addEventListener('click',()=>{
        if(registration.waiting)registration.waiting.postMessage({type:'SKIP_WAITING'});
        else location.reload();
      });
      registration.update();
    }catch(error){
      console.error('Không thể đăng ký PWA:',error);
    }
  });
})();
</script>
