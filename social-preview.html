<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OYEN · Xem thử Mạng xã hội</title><style>
  :root{
    --bg:#F3F6FC; --panel:#FFFFFF; --panel-alt:#EAF1FE;
    --ink:#1F2430; --ink-soft:#66707E; --ink-faint:#98A2B3;
    --green:#2F6FED; --green-soft:#2558C4; --gold:#B5852B; --red:#E0483B; --blue:#2F6FED;
    --line:#E3E8F0; --line-soft:#EEF2F8;
    --icon-green:#E3ECFE; --icon-gold:#FBF0DC; --icon-blue:#E3ECFE; --icon-red:#FDE7E4;
    --grad-start:#4C8DFF; --grad-end:#1B4FD1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Segoe UI', system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--ink);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#DED2B4;border-radius:8px;}
  input,select,textarea,button{font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(47,70,48,0.12);}
  button:focus-visible{outline:2px solid var(--green);outline-offset:2px;}

  .app{display:flex;min-height:100vh;}
  .sidebar{width:226px;background:#fff;border-right:1px solid var(--line);color:var(--ink);flex-shrink:0;padding:26px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:30px;padding-left:6px;}
  .brand-badge{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--grad-start),var(--grad-end));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0;box-shadow:0 4px 10px rgba(47,111,237,0.3);}
  .brand-name{font-weight:800;font-size:16px;letter-spacing:.2px;color:var(--ink);}
  .brand-sub{font-size:11px;color:var(--ink-faint);}
  .navlist{display:flex;flex-direction:column;gap:3px;}
  .navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:none;cursor:pointer;text-align:left;font-size:14px;font-weight:600;background:transparent;color:var(--ink-soft);width:100%;}
  .navitem:hover{background:var(--panel-alt);}
  .navitem.active{background:var(--panel-alt);color:var(--green);}
  .navicon{font-size:16px;width:18px;text-align:center;}

  .mobileheader{display:none;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
  .mobileheader-greet{font-size:11.5px;color:var(--ink-faint);}
  .mobileheader-name{font-weight:800;font-size:15.5px;color:var(--ink);}
  .mobileheader-bell{font-size:18px;background:var(--panel-alt);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}

  .mobilenav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:8px 4px;justify-content:space-around;box-shadow:0 -2px 14px rgba(20,30,60,0.06);}
  .mobilenav button{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-faint);font-size:9.5px;font-weight:600;padding:4px;}
  .mobilenav button.active{color:var(--green);}
  .mobilenav .navicon{font-size:17px;}

  .fab{position:fixed;right:22px;bottom:28px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--grad-start),var(--grad-end));color:#fff;border:none;font-size:27px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 22px rgba(47,111,237,0.4);z-index:60;}
  .fab:hover{filter:brightness(1.06);}

  .segmented{display:inline-flex;background:var(--panel-alt);border-radius:12px;padding:4px;gap:2px;}
  .segmented button{border:none;background:transparent;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .segmented button.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(20,30,60,0.14);}
  .range-extra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .range-extra button{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:20px;cursor:pointer;}
  .range-extra button.active{background:var(--green);border-color:var(--green);color:#fff;}
  .order-stage-tabs{display:flex;gap:8px;overflow-x:auto;margin:0 0 16px;padding-bottom:2px;scrollbar-width:thin;}
  .order-stage-tab{border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .order-stage-tab.active{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 12px rgba(47,111,87,.18);}
  .order-check{display:flex;align-items:center;justify-content:center;padding:6px;cursor:pointer;}
  .order-check input,.bulk-select input{width:17px;height:17px;accent-color:var(--green);cursor:pointer;}
  .bulk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel-alt);border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;}
  .bulk-select{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .bulk-count{font-size:13px;color:var(--ink-soft);margin-right:auto;}
  .order-workflow-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  .more-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:18px;cursor:pointer;color:var(--ink);}
  .more-card:hover{border-color:var(--green-soft);background:var(--panel-alt);}
  .more-card-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--icon-green);flex:0 0 auto;}
  .more-card-title{font-size:15px;font-weight:800;}
  .more-card-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}

  .auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f5f0e8,#eef5ef);}
  .auth-card{width:min(460px,100%);background:#fff;border:1px solid var(--line-soft);border-radius:20px;padding:28px;box-shadow:0 18px 45px rgba(35,55,45,.13);}
  .auth-logo{width:58px;height:58px;border-radius:17px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900;margin-bottom:16px;}
  .auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel-alt);padding:4px;border-radius:11px;margin:18px 0;}
  .auth-tabs button{border:0;background:transparent;padding:9px;border-radius:8px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .auth-tabs button.active{background:#fff;color:var(--green);box-shadow:0 1px 5px rgba(20,30,60,.12);}
  .auth-message{font-size:12.5px;margin:10px 0;color:var(--red);min-height:18px;}
  .user-chip{display:flex;align-items:center;gap:8px;margin-top:auto;padding:12px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-soft);}
  .customer-app{min-height:100vh;background:#f7f5ef;padding-bottom:82px;}
  .customer-header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line-soft);padding:12px max(16px,calc((100vw - 980px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .customer-brand{font-size:20px;font-weight:900;color:var(--green);letter-spacing:1px;}
  .customer-content{width:min(980px,calc(100% - 28px));margin:20px auto;}
  .customer-nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;box-shadow:0 -3px 16px rgba(20,30,60,.07);}
  .customer-nav button{width:min(180px,25%);border:0;background:#fff;padding:10px 5px 8px;color:var(--ink-faint);font-size:11px;font-weight:700;cursor:pointer;}
  .customer-nav button span{display:block;font-size:20px;margin-bottom:2px;}
  .customer-nav button.active{color:var(--green);}
  .menu-day{margin:20px 0 10px;font-size:17px;font-weight:800;}
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .menu-product{background:#fff;border:1px solid var(--line-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;}
  .menu-product-name{font-size:15px;font-weight:800;line-height:1.35;}
  .qty-control{display:flex;align-items:center;gap:8px;margin-top:auto;}
  .qty-control button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;}
  .qty-control strong{min-width:25px;text-align:center;}
  .cart-bar{position:sticky;bottom:74px;background:var(--green);color:#fff;border-radius:14px;padding:13px 16px;margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 10px 25px rgba(47,111,87,.26);}
  .portal-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;}
  .portal-list-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line-soft);font-size:13px;}

  .hero-card{background:linear-gradient(135deg,var(--grad-start),var(--grad-end));border-radius:16px;padding:20px 22px;color:#fff;margin-bottom:16px;box-shadow:0 10px 26px rgba(47,111,237,0.28);}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
  .hero-label{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .hero-dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;display:inline-block;}
  .hero-date{font-size:12px;opacity:.85;margin-top:5px;}
  .hero-link{background:none;border:none;color:#fff;opacity:.9;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .hero-bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .hero-growth{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,0.2);}
  .hero-amount{font-size:30px;font-weight:800;}

  .linechart-wrap{position:relative;}
  .linechart-legend{display:flex;gap:16px;justify-content:flex-end;margin-bottom:6px;font-size:12px;color:var(--ink-soft);}
  .legend-dot{display:inline-flex;align-items:center;gap:5px;}
  .legend-swatch{width:14px;height:3px;border-radius:2px;display:inline-block;}
  .linechart-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-faint);margin-top:2px;padding:0 2px;}

  .quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 20px;}
  .qa-item{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:6px 2px;}
  .qa-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .qa-label{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-align:center;line-height:1.3;}

  .pending-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .pending-chip{flex:1;min-width:150px;background:var(--panel-alt);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:none;text-align:left;}
  .pending-chip-label{font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
  .pending-chip-value{font-size:20px;font-weight:800;color:var(--ink);}
  .pending-chip-arrow{color:var(--ink-faint);font-size:16px;}

  .pkg-compact-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:16px;cursor:pointer;}
  .pkg-compact-card:hover{border-color:var(--green-soft);}
  .pkg-compact-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .pkg-compact-name{font-weight:700;font-size:15px;}
  .pkg-compact-meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .pkg-compact-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);gap:8px;flex-wrap:wrap;}
  .pkg-sub-count{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;}

  .subscriber-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line-soft);flex-wrap:wrap;}
  .subscriber-name{font-weight:700;font-size:13.5px;}
  .subscriber-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
  .subscriber-actions select{font-size:12px;padding:5px 8px;width:auto;}

  .main{flex:1;padding:28px 32px;min-width:0;padding-bottom:80px;}

  .section-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:12px;flex-wrap:wrap;}
  .section-title{margin:0;font-size:22px;font-weight:800;color:var(--ink);}
  .section-sub{margin:4px 0 0;font-size:13.5px;color:var(--ink-soft);}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap;}
  .btn-solid{background:var(--green);color:#fff;}
  .btn-solid:hover{background:var(--green-soft);}
  .btn-ghost{background:transparent;color:var(--green);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--panel-alt);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--line);}
  .btn-danger:hover{background:#FBEDEA;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:6px;border-radius:6px;}
  .icon-btn:hover{background:var(--line-soft);color:var(--ink);}

  .stats-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
  .stat-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:16px 18px;flex:1;min-width:150px;}
  .stat-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .stat-value{font-size:24px;font-weight:800;}
  .stat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
  .trend-pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;}
  .trend-up{color:#2E6B3E;background:#E1F0E3;}
  .trend-down{color:var(--red);background:#F7E4E0;}

  .range-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .range-pill{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:13px;font-weight:600;padding:7px 13px;border-radius:20px;cursor:pointer;}
  .range-pill.active{background:var(--green);border-color:var(--green);color:#fff;}
  .range-dates{display:flex;gap:8px;align-items:center;}

  .alert-list{display:flex;flex-direction:column;gap:8px;}
  .alert-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:#FBF1DE;border:1px solid #EEDDB0;}
  .alert-item.danger{background:#FBEAE6;border-color:#EFC7BC;}
  .alert-name{font-size:13.5px;font-weight:700;}
  .alert-sub{font-size:12px;color:var(--ink-soft);}

  .progress-track{height:8px;border-radius:6px;background:var(--line-soft);overflow:hidden;margin:8px 0;}
  .progress-fill{height:100%;border-radius:6px;background:var(--green-soft);}
  .progress-fill.low{background:var(--gold);}
  .progress-fill.empty{background:var(--red);}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);}

  .branch-pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--blue);background:var(--icon-blue);padding:2px 8px;border-radius:20px;}
  .settings-block{margin-bottom:22px;}
  .settings-block h4{font-size:14px;margin:0 0 8px;}
  .code-box{background:#232019;color:#E9E2CC;font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;padding:14px 16px;border-radius:9px;overflow-x:auto;white-space:pre;line-height:1.6;}
  .conn-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:20px;}
  .conn-ok{background:#E1F0E3;color:#2E6B3E;}
  .conn-off{background:#F0E9D8;color:var(--ink-soft);}

  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:20px;}
  .panel-title{font-size:14px;font-weight:700;margin-bottom:16px;}
  .dash-grid{display:flex;gap:18px;flex-wrap:wrap;}
  .dash-col{flex:1 1 320px;}

  .chart-bars{display:flex;align-items:flex-end;gap:10px;height:130px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .chart-bar{width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--green-soft);}
  .chart-bar.today{background:var(--gold);}
  .chart-day{font-size:11px;color:var(--ink-faint);text-transform:capitalize;}

  .upcoming-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line-soft);}
  .upcoming-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}

  .filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .date-box{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;}
  .date-box input{border:none;font-size:13.5px;background:transparent;color:var(--ink);}
  .check-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .search-wrap{position:relative;flex:1 1 180px;min-width:160px;}
  .search-wrap .search-icon{position:absolute;left:10px;top:11px;color:var(--ink-faint);font-size:13px;}
  .search-wrap input{padding-left:28px;}

  .input{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line);font-size:14px;color:var(--ink);background:#fff;}
  textarea.input{resize:vertical;min-height:64px;}
  .field{display:block;margin-bottom:14px;}
  .field-label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field-hint{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
  .field-row{display:flex;gap:12px;}
  .field-row>.field{flex:1;}

  .empty-state{text-align:center;padding:56px 20px;color:var(--ink-faint);border:1px dashed var(--line);border-radius:12px;background:#fff;}
  .empty-icon{font-size:30px;margin-bottom:10px;opacity:.6;}
  .empty-title{font-size:14.5px;font-weight:600;color:var(--ink-soft);}
  .empty-sub{font-size:13px;margin-top:4px;}

  .order-row{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .order-row:hover{border-color:var(--green-soft);}
  .order-row.dragging{opacity:.5;border-style:dashed;}
  .order-row.drag-over{border-color:var(--green);box-shadow:0 0 0 2px rgba(47,111,87,.14);}
  .drag-handle{border:none;background:transparent;color:var(--ink-faint);font-size:20px;line-height:1;padding:8px 4px;cursor:grab;touch-action:none;user-select:none;}
  .drag-handle:active{cursor:grabbing;color:var(--green);}
  .order-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;}
  .order-sub{font-size:12.5px;color:var(--ink-faint);display:flex;align-items:center;gap:4px;margin-top:2px;}
  .order-contact{color:var(--ink);font-weight:700;overflow-wrap:anywhere;}
  .order-note{margin-top:6px;color:var(--red);font-size:13px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;}
  .order-items{font-size:13px;color:var(--ink-soft);}
  .order-total{font-weight:700;color:var(--ink);margin-top:3px;}
  .order-time{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;min-width:130px;}
  .status-select{font-weight:600;}

  .product-combobox{position:relative;flex:1;min-width:220px;}
  .product-combobox input.item-product-search{width:100%;padding-right:34px;}
  .product-combobox-arrow{position:absolute;right:11px;top:9px;color:var(--ink-faint);pointer-events:none;font-size:12px;}

async function socialApi(path,options={}){
 if(!socialApiBase)throw new Error('Chưa cấu hình máy chủ kết nối. Bấm “Thiết lập kết nối” để xem hướng dẫn.');
 const headers={'Content-Type':'application/json',...(options.headers||{})};
 const session=supaClient ? await supaClient.auth.getSession() : null;
 if(!session?.data?.session?.access_token)throw new Error('Cần đăng nhập tài khoản quản trị để dùng kết nối thật.');
 headers.Authorization='Bearer '+session.data.session.access_token;
 const response=await fetch(socialApiBase+path,{...options,headers,signal:AbortSignal.timeout(20000)});
 let data;try{data=await response.json();}catch(e){throw new Error('Máy chủ chưa trả về JSON hợp lệ.');}
 if(!response.ok)throw new Error(data.message||`Máy chủ trả lỗi ${response.status}.`);
 return data;
}

function socialSetChannel(index){if(socialState.busy||socialState.sending)return;socialState.channel=OYEN_SOCIAL_CHANNELS[index].id;socialReset();socialState.account=socialState.accounts.find(a=>a.provider===socialState.channel)?.id||'';socialRender();if(socialState.demo)socialLoadDemo();else if(socialState.account)socialLoadThreads();}

async function socialRefresh(){
 if(socialState.busy||socialState.sending)return;
 if(socialState.demo){socialLoadDemo();return;}
 socialState.busy=true;socialState.error='';socialRender();
 try{
  const result=await socialApi('/accounts');
  if(!Array.isArray(result.accounts)||result.accounts.some(a=>!a||typeof a.id!=='string'||!OYEN_SOCIAL_CHANNELS.some(c=>c.id===a.provider)))throw new Error('Danh sách tài khoản từ máy chủ không hợp lệ.');
  socialState.accounts=result.accounts.filter(a=>a.status==='connected');
  if(!socialAccount())socialState.account=socialState.accounts.find(a=>a.provider===socialState.channel)?.id||'';
  socialReset();
  if(socialState.account)await socialLoadThreads();
 }catch(e){socialError(e);}finally{socialState.busy=false;socialRender();}
}
async function socialLoadThreads(){
 if(socialState.demo)return socialLoadDemo();
 const request=++socialState.request;socialState.loading=true;socialState.error='';socialRender();
 try{
  const account=socialAccount();
  if(!account||!account.capabilities?.[socialState.kind]){socialState.threads=[];return;}
  const data=await socialApi(`/threads?accountId=${encodeURIComponent(account.id)}&kind=${socialState.kind}`);
  if(!Array.isArray(data.threads)||data.threads.some(t=>!t||typeof t.id!=='string'))throw new Error('Danh sách hội thoại không hợp lệ.');
  if(request!==socialState.request)return;
  socialState.threads=data.threads;socialState.selected=null;socialState.messages=[];
 }catch(e){if(request===socialState.request)socialError(e);}finally{if(request===socialState.request){socialState.loading=false;socialRender();}}
}

async function socialSelectThread(index){
 if(socialState.sending||socialState.busy)return;
 const t=socialState.threads[index];if(!t)return;
 socialState.selected=t.id;socialState.messages=[];socialState.error='';socialState.notice='';
 const request=++socialState.request;
 if(socialState.demo){t.unread=false;socialState.messages=[{id:'demo-msg',direction:'in',text:t.preview,createdAt:new Date().toISOString()}];socialRender();return;}
 socialState.loading=true;socialRender();
 try{
  const data=await socialApi(`/threads/${encodeURIComponent(t.id)}?accountId=${encodeURIComponent(socialState.account)}`);
  if(!Array.isArray(data.messages)||data.messages.some(m=>!m||typeof m.text!=='string'))throw new Error('Nội dung hội thoại không hợp lệ.');
  if(request!==socialState.request)return;
  socialState.messages=data.messages;
  if(t.unread){await socialApi(`/threads/${encodeURIComponent(t.id)}`,{method:'PATCH',body:JSON.stringify({accountId:socialState.account,unread:false})});if(request===socialState.request)t.unread=false;}
 }catch(e){if(request===socialState.request)socialError(e);}finally{if(request===socialState.request){socialState.loading=false;socialRender();}}
}
async function socialSend(event){
 event.preventDefault();if(socialState.sending||socialState.busy||socialState.loading)return;
 const thread=socialThread(),key=socialKey(),text=(socialState.drafts[key]||'').trim();if(!thread||!text)return;
 socialState.sending=true;socialState.error='';socialRender();
 try{
  if(socialState.demo){socialState.messages.push({id:uid(),direction:'out',text,createdAt:new Date().toISOString()});socialState.notice='Tin mẫu chỉ hiển thị trong phiên xem thử, không gửi ra mạng xã hội.';}
  else{
   if(!socialAccount()?.capabilities?.[socialState.kind==='comments'?'replyComments':'sendMessages'])throw new Error('Tài khoản chưa có quyền trả lời cho mục này.');
   // Retain request ID on ambiguous failures so retries cannot send twice.
   const pending=thread.pendingReply;
   const idempotencyKey=pending?.text===text?pending.key:crypto.randomUUID();thread.pendingReply={text,key:idempotencyKey};
   const data=await socialApi(`/threads/${encodeURIComponent(thread.id)}/reply`,{method:'POST',body:JSON.stringify({accountId:socialState.account,text,idempotencyKey})});
   if(!data.message||typeof data.message.text!=='string')throw new Error('Chưa xác nhận được tin đã gửi. Hãy làm mới hội thoại trước khi gửi lại.');
   socialState.messages.push(data.message);delete thread.pendingReply;
  }
  socialState.drafts[key]='';thread.preview=text;
 }catch(e){socialError(e);}finally{socialState.sending=false;socialRender();}
}
async function socialUpdateThread(action){

 socialState.busy=true;socialState.error='';socialRender();
 try{if(!socialState.demo)await socialApi(`/threads/${encodeURIComponent(t.id)}`,{method:'PATCH',body:JSON.stringify({accountId:socialState.account,...update})});Object.assign(t,update);}catch(e){socialError(e);}finally{socialState.busy=false;socialRender();}
}

async function socialConnect(){
 if(socialState.demo){socialState.notice='Đang xem thử. Tắt xem thử rồi thiết lập backend để kết nối tài khoản thật.';socialRender();return;}
 if(!socialApiBase)return socialSetup();
 if(socialState.busy||socialState.sending)return;
 const popup=window.open('about:blank','oyen-social-oauth','width=620,height=760');
 socialState.busy=true;socialState.error='';socialRender();
 try{
  const data=await socialApi('/connect',{method:'POST',body:JSON.stringify({provider:socialState.channel,returnOrigin:location.origin})});

  const hosts={zalo:['oauth.zaloapp.com'],facebook:['www.facebook.com','facebook.com'],tiktok:['www.tiktok.com','business-api.tiktok.com','business.tiktok.com']};

async function socialCreateOrder(event){
 event.preventDefault();if(socialState.busy||socialState.sending)return;
 const t=socialThread();if(!t)return;
 if(socialState.demo){socialState.notice='Xem thử: đã kiểm tra luồng lên đơn. Chưa tạo đơn thật hoặc lưu khách mẫu.';socialRender();return;}
 if(!socialAccount())return;
 const d=socialDraft();socialState.error='';socialState.notice='';
 let snapshot=null;socialState.busy=true;socialRender();
 try{
  if(!d.name.trim()||!d.phone.trim()||!d.address.trim()||!d.date)throw new Error('Điền đủ tên, điện thoại, địa chỉ và ngày giao.');
  if(!DB.branches.some(b=>b.id===d.branch))throw new Error('Vui lòng chọn cơ sở.');
  if(!Number.isFinite(Number(d.shipping))||Number(d.shipping)<0)throw new Error('Phí giao hàng không hợp lệ.');
  const items=d.items.map(i=>{const p=DB.products.find(p=>p.id===i.productId),qty=Number(i.qty);if(!p||!Number.isInteger(qty)||qty<1||!Number.isFinite(Number(p.price))||Number(p.price)<0)throw new Error('Chọn sản phẩm và số lượng nguyên dương.');return {productId:p.id,name:p.name,price:Number(p.price),volumeMl:productVolumeMl(p),qty};});
  if(!items.length)throw new Error('Chọn ít nhất một sản phẩm.');
  let customer=DB.customers.find(c=>c.id===d.customerId);
  if(d.customerId&&!customer)throw new Error('Khách hàng đã thay đổi. Vui lòng chọn lại.');
  const normalized=normalizeVietnamPhone(d.phone);if(!normalized)throw new Error('Số điện thoại Việt Nam không hợp lệ.');
  if(!customer)customer=DB.customers.find(c=>normalizeVietnamPhone(c.phone)===normalized);
  if(customerOrderOnDate(customer?.id||'',d.date,null,d.phone))throw new Error('Khách đã có đơn trong ngày giao này. Vào Đơn hàng để cập nhật đơn hiện có.');
  snapshot=safeClone({customers:DB.customers,orders:DB.orders});
  if(!customer){customer={id:uid(),name:d.name.trim(),phone:d.phone.trim(),address:d.address.trim(),vip:false,note:'',createdAt:todayISO()};DB.customers.push(customer);}
  const order={id:uid(),orderType:'order',customerId:customer.id,customerName:d.name.trim(),phone:d.phone.trim(),address:d.address.trim(),branchId:d.branch,items,total:socialOrderTotal(),shippingFee:Number(d.shipping),colorTag:'',tagNote:'',subscriberId:null,subRestored:false,deliveryDate:d.date,deliveryTime:'',status:'cho_xac_nhan',note:d.note.trim(),createdAt:new Date().toISOString(),orderPosition:nextOrderPosition(),paymentStatus:'chua_thanh_toan',paidAt:null,socialSource:{provider:socialState.channel,accountId:socialState.account,threadId:t.id,kind:socialState.kind}};
  DB.orders.push(order);
  const records=[{key:'nuts:orders',value:DB.orders.filter(o=>!o.portalOrderId)}];
  if(!safeEqual(snapshot.customers,DB.customers))records.push({key:'nuts:customers',value:DB.customers});
  await safeEnqueue(records);snapshot=null;delete socialState.orderDrafts[socialKey()];socialState.notice='Đã lưu đơn vào mục Đơn hàng. Chưa gửi thông báo cho khách.';
 }catch(e){if(snapshot)Object.assign(DB,snapshot);socialError(e);}finally{socialState.busy=false;socialRender();}
}

 const t=socialThread();if(!t)return '<div class="soc-chat soc-empty"><div><div class="soc-empty-icon">☏</div><h3>Chọn một hội thoại</h3><p>Tin nhắn, bình luận và ô lên đơn sẽ hiển thị tại đây.</p></div></div>';
 const canReply=socialState.demo||socialAccount()?.capabilities?.[socialState.kind==='comments'?'replyComments':'sendMessages'];
 return `<div class="soc-chat"><div class="soc-chat-head"><div><strong>${escapeHtml(t.customerName||'Khách hàng')}</strong><small>${socialState.kind==='comments'?'Bình luận':'Tin nhắn'} · ${escapeHtml(socialChannel().name)}${t.hidden?' · Đã ẩn':''}</small></div><div class="soc-actions"><button class="soc-small" onclick="socialUpdateThread('status')" ${socialState.busy?'disabled':''}>${t.status==='done'?'Mở lại':'✓ Đã xử lý'}</button><button class="soc-small" onclick="socialUpdateThread('unread')">Chưa đọc</button>${socialState.kind==='comments'&&(socialState.demo||socialAccount()?.capabilities?.hideComments)?`<button class="soc-small" onclick="socialHideComment()">${t.hidden?'Hiện bình luận':'Ẩn bình luận'}</button>`:''}</div></div>${socialState.kind==='comments'?`<div class="soc-post">Bài viết: ${escapeHtml(t.postTitle||'Bình luận từ tài khoản đã kết nối')}</div>`:''}<div class="soc-messages" role="log" aria-label="Nội dung hội thoại">${socialState.loading?'<div class="soc-empty">Đang tải nội dung…</div>':socialState.messages.map(m=>`<div class="soc-bubble ${m.direction==='out'?'out':'in'}"><div>${escapeHtml(m.text)}</div><small>${escapeHtml(m.createdAt?new Date(m.createdAt).toLocaleString('vi-VN'):'')}${m.direction==='out'?' · '+(socialState.demo?'Tin mẫu':'Đã gửi'):''}</small></div>`).join('')}</div><form class="soc-compose" onsubmit="socialSend(event)"><label class="soc-muted" for="socialReply">${canReply?'Trả lời '+(socialState.kind==='comments'?'bình luận':'khách hàng'):'Chưa được cấp quyền trả lời trên kênh này'}</label><textarea id="socialReply" class="input" rows="3" maxlength="2000" required placeholder="Nhập nội dung trả lời…" ${!canReply||socialState.sending?'disabled':''} oninput="socialState.drafts[socialKey()]=this.value">${escapeHtml(socialState.drafts[socialKey()]||'')}</textarea><button class="btn btn-solid" type="submit" ${!canReply||socialState.sending||socialState.loading||socialState.busy?'disabled':''}>${socialState.sending?'Đang gửi…':socialState.demo?'Gửi thử':'Gửi trả lời'}</button></form></div>${socialRenderOrder()}`;
}
function renderSocialTab(){
 const channel=socialChannel(),account=socialAccount(),connected=!!account,enabled=socialState.demo||connected,capable=socialState.demo||account?.capabilities?.[socialState.kind];
 return `<section class="soc"><div class="soc-heading"><div><h1>Mạng xã hội</h1><p>Chăm sóc khách hàng và lên đơn ngay trong hội thoại</p></div><div class="soc-actions"><button class="btn" onclick="socialSetup()">Thiết lập kết nối</button><button class="btn" onclick="socialToggleDemo()">${socialState.demo?'Thoát xem thử':'Xem thử giao diện'}</button><button class="btn" onclick="socialRefresh()" ${socialState.busy||!socialApiBase&&!socialState.demo?'disabled':''}>Làm mới</button></div></div><div class="soc-channels">${OYEN_SOCIAL_CHANNELS.map((c,index)=>`<button class="soc-channel ${c.id===channel.id?'active':''}" onclick="socialSetChannel(${index})" style="--soc-brand:${c.color}"><span class="soc-brand">${c.icon}</span><span><strong>${c.name}</strong><small>${escapeHtml(c.hint)}</small></span><span class="soc-pill">${socialState.demo?'Xem thử':socialState.accounts.some(a=>a.provider===c.id)?'Đã kết nối':'Chưa kết nối'}</span></button>`).join('')}</div>${socialState.demo?'<div class="soc-note">CHẾ ĐỘ XEM THỬ · Dữ liệu mẫu trong phiên này. Không gửi tin, kết nối tài khoản hoặc lưu đơn thật.</div>':''}${socialState.error?`<div class="soc-error" role="alert">${escapeHtml(socialState.error)}</div>`:''}${socialState.notice?`<div class="soc-note" role="status">${escapeHtml(socialState.notice)}</div>`:''}<div class="soc-toolbar"><div class="segmented"><button class="${socialState.kind==='messages'?'active':''}" onclick="socialSetKind('messages')">Tin nhắn</button><button class="${socialState.kind==='comments'?'active':''}" onclick="socialSetKind('comments')">Bình luận</button></div><div class="soc-actions">${connected&&!socialState.demo?`<select class="input" aria-label="Tài khoản đang quản lý" onchange="socialSetAccount(this.value)">${socialState.accounts.filter(a=>a.provider===channel.id).map(a=>`<option value="${escapeHtml(a.id)}" ${a.id===socialState.account?'selected':''}>${escapeHtml(a.name||a.id)}</option>`).join('')}</select><button class="btn" onclick="socialDisconnect()">Ngắt kết nối</button>`:''}<button class="btn btn-solid" onclick="socialConnect()" ${socialState.busy?'disabled':''}>＋ Kết nối ${channel.name}</button></div></div>${!enabled?`<div class="soc-connect-empty"><span class="soc-brand" style="--soc-brand:${channel.color}">${channel.icon}</span><h2>Kết nối ${channel.name} với OYEN</h2><p>Quản lý tin nhắn, bình luận và tạo đơn từ cùng một màn hình.</p><p class="soc-muted">${escapeHtml(channel.hint)}. Chức năng khả dụng phụ thuộc quyền API được cấp.</p><button class="btn btn-solid" onclick="socialConnect()">Kết nối tài khoản</button><button class="btn" onclick="socialToggleDemo()">Xem thử trước</button><p class="soc-muted">Chưa có backend? Mở Thiết lập kết nối để xem các bước triển khai.</p></div>`:!capable?'<div class="soc-connect-empty"><h2>Chưa có quyền cho mục này</h2><p>Tài khoản đã kết nối nhưng nền tảng chưa cấp quyền tin nhắn hoặc bình luận tương ứng. Kiểm tra quyền tại backend rồi bấm Làm mới.</p></div>':`<div class="soc-workspace ${socialThread()?'has-thread':''}"><aside class="soc-list"><div class="soc-list-tools"><label for="socialSearch" class="soc-muted">Tìm hội thoại</label><input class="input" id="socialSearch" type="search" placeholder="Tên, điện thoại, nội dung…" value="${escapeHtml(socialState.search)}" oninput="socialState.search=this.value;socialFilter()"><select class="input" aria-label="Lọc hội thoại" onchange="socialState.filter=this.value;socialFilter()"><option value="all" ${socialState.filter==='all'?'selected':''}>Tất cả hội thoại</option><option value="unread" ${socialState.filter==='unread'?'selected':''}>Chưa đọc</option><option value="open" ${socialState.filter==='open'?'selected':''}>Đang xử lý</option><option value="done" ${socialState.filter==='done'?'selected':''}>Đã xử lý</option></select></div><div id="socialThreadList">${socialRenderThreads()}</div></aside>${socialRenderChat()}</div>`}</section>`;
}

socialToggleDemo();socialSelectThread(0);</script></body></html>
