<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080B1F">
  <title>ECOM DIGITAL — Ngoại tuyến</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 0,#281b55 0,transparent 38%),#050816;color:#e8e9f1;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,560px);padding:30px;border:1px solid #ffffff1c;border-radius:18px;background:#10142be8;box-shadow:0 22px 70px #0008}.logo{width:58px;height:58px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#8b5cf6,#ec4899);font-weight:900;font-size:21px}h1{margin:22px 0 8px;font-size:28px}p{color:#a7abc0;margin:0 0 24px}button{border:0;border-radius:11px;padding:12px 18px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font:inherit;font-weight:750;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">ED</div>
    <h1>Thiết bị đang ngoại tuyến</h1>
    <p>Giao diện đã được lưu để mở nhanh, nhưng dữ liệu kinh doanh và đăng nhập Supabase cần kết nối Internet. Hãy kiểm tra mạng rồi thử lại.</p>
    <button type="button" onclick="location.reload()">Thử kết nối lại</button>
  </main>
</body>
</html>
